const SCEN=[
{id:"osi-web",t:"netplus",tag:"OSI in real life",title:"What actually happens when you load a webpage",diag:"osi",
story:"A user at a branch office opens the company intranet. In under a second, every OSI layer does its job — and knowing which layer does what is how you troubleshoot instead of guess.",
steps:["L7: the browser asks DNS (UDP 53) for the server's IP, then speaks HTTP.","L6: TLS encrypts the session; text and images get encoded.","L4: TCP opens a connection to port 443 and numbers every segment so nothing arrives out of order.","L3: each packet gets source/destination IPs; routers read only this layer to pick the path.","L2/L1: at every hop the packet is re-wrapped in a fresh frame with new MAC addresses, then pushed onto the wire as bits. The IP header survives end-to-end; the frame is rebuilt at every hop."],
field:"Troubleshoot bottom-up like a NOC tech: link light (L1) → ARP/MAC table (L2) → ping the gateway (L3) → test the port (L4) → check the app (L7). Each test you pass eliminates a layer.",
take:"IP addresses travel end-to-end; MAC addresses only live for one hop.",
q:{t:"netplus",q:"A user can ping the server's IP but the website won't load. Which layers are now the prime suspects?",a:["Layer 1 – cabling","Layer 3 – routing","Layer 4/7 – blocked port or dead service","Layer 2 – switching"],c:2,x:"A successful ping proves L1–L3 work end-to-end. What's left is the transport connection (firewall blocking 443?) or the application itself."}},
{id:"dhcp-out",t:"netplus",tag:"DHCP · APIPA",title:"The morning every phone showed 169.254.x.x",diag:"dora",
story:"After a weekend switch replacement, the call center opens and nothing can reach anything. Every device shows an address starting 169.254 — the classic fingerprint of a DHCP failure.",
steps:["Clients broadcast DHCP DISCOVER at boot — and broadcasts do not cross routers.","The old switch had 'ip helper-address 10.9.9.5' on the voice VLAN interface, relaying those broadcasts to the DHCP server. The new config didn't.","With no OFFER coming back, clients self-assign APIPA addresses (169.254.0.0/16) — link-local only, no gateway, no reachability.","Re-adding the helper address fixes it; clients renew and come online."],
field:"169.254.x.x on a client is never the client's fault first — check DHCP scope exhaustion, the server, VLAN assignment, and helper addresses on the L3 interface.",
take:"APIPA = 'I asked for DHCP and nobody answered.'",
q:{t:"netplus",q:"Devices on VLAN 30 get APIPA addresses but VLAN 20 works fine. The DHCP server sits on VLAN 10. Most likely cause?",a:["The DHCP server is down","Missing ip helper-address on VLAN 30's L3 interface","Bad cabling on VLAN 30","DNS misconfiguration"],c:1,x:"If the server were down, VLAN 20 would fail too. One VLAN failing points at the relay — the helper address on that VLAN's gateway interface."}},
{id:"cable-wh",t:"netplus",tag:"Media selection",title:"The access point at the far end of the warehouse",diag:"cable",
story:"Operations wants Wi-Fi coverage 150 m from the IDF, past a row of welding stations. The junior tech quotes a long Cat6 run. Two problems are hiding in that quote.",
steps:["Copper Ethernet is spec'd to 100 m total, including patch leads — at 150 m links may negotiate down, flap, or fail outright.","Welders throw serious EMI; even shielded copper picks up noise and corrupts frames (CRC errors climbing on the switch port is the tell).","Multimode fiber solves both: 550 m reach and total EMI immunity, terminated with a media converter or an SFP at each end."],
field:"Any time a run crosses a factory floor, elevator shafts, or fluorescent ballasts — think fiber first. CRC/input errors incrementing on an interface often means a physical/EMI problem, not a config problem.",
take:"100 m is a wall, not a suggestion — and EMI is why fiber wins indoors, not just for distance.",
q:{t:"netplus",q:"A switch port shows steadily incrementing CRC errors on a long copper run near heavy machinery. Best fix?",a:["Increase the MTU","Replace the run with fiber","Enable QoS","Set the port to full duplex"],c:1,x:"CRC errors near machinery scream physical-layer corruption from EMI or an out-of-spec run — fiber removes both causes. Config changes can't fix damaged bits."}},
{id:"voip-jit",t:"netplus",tag:"QoS · jitter",title:"Why the sales calls sound like robots",diag:"jitter",
story:"A remote site reports garbled, choppy voice calls, but file downloads are fast and ping averages look fine. Averages are exactly what's hiding the problem.",
steps:["Voice sends a small packet every 20 ms and needs them to ARRIVE every 20 ms.","Big data transfers queue up ahead of voice packets, so voice arrives in bursts — the spacing varies wildly. That variation is jitter.","The jitter buffer absorbs a little, but past ~30 ms of variation it drops packets → robotic audio.","Fix: classify voice (DSCP EF) and give it a priority queue so it always jumps ahead of bulk traffic."],
field:"When 'the network is fine but calls are bad,' pull per-packet stats, not averages — look at jitter and loss. Same reason monitoring dashboards graph p95/p99 latency, not just the mean.",
take:"Bandwidth fixes slow; QoS fixes choppy. They are different problems.",
q:{t:"netplus",q:"Users report choppy VoIP while downloads stay fast. Which metric should you examine first?",a:["Total bandwidth utilization","Jitter","DNS response time","MTU size"],c:1,x:"Choppy voice with healthy throughput is the signature of jitter — uneven packet arrival. Bandwidth being 'enough' doesn't mean delivery is smooth."}},
{id:"vlan-dept",t:"ccna",tag:"VLANs · inter-VLAN routing",title:"Two departments, one switch, zero budget",diag:"vlan",
story:"Sales and Engineering share one 48-port switch. Engineering's lab traffic floods everyone, and Sales shouldn't reach the lab at all. You have one switch and one router interface to fix it with.",
steps:["Create VLAN 10 (Sales) and VLAN 20 (Eng); assign access ports. Each VLAN is now its own broadcast domain — lab chatter stays in the lab.","Hosts in different VLANs can't talk at all yet, even on the same switch. That's the point: crossing VLANs requires Layer 3.","Router-on-a-stick: one physical link becomes an 802.1Q trunk; subinterfaces Gi0/0.10 and Gi0/0.20 each get 'encapsulation dot1q <vlan>' and act as each VLAN's gateway.","Now an ACL on the router controls exactly what Sales may reach in Engineering."],
field:"This is the standard small-site pattern. In bigger networks the same idea moves into a Layer 3 switch with SVIs — same logic, faster hardware.",
take:"A VLAN splits broadcast domains at L2; routing (and therefore policy) is the only bridge between them.",
q:{t:"ccna",q:"Two PCs on the SAME switch, in different VLANs, with correct IPs — why can't they ping each other?",a:["Spanning tree is blocking the ports","Traffic between VLANs requires a Layer 3 device","The switch's MAC table is full","They need static ARP entries"],c:1,x:"VLANs are separate L2 domains even inside one chassis. Without a router or L3 switch routing between them, no frame crosses — by design."}},
{id:"stp-storm",t:"ccna",tag:"STP · loops",title:"The loop that took down the third floor",diag:"stp",
story:"A well-meaning tech patches two access switches directly together 'for redundancy.' Thirty seconds later, every port LED on the floor is solid on, the switch CPUs are pegged, and nothing works.",
steps:["A single broadcast (say, an ARP request) enters the loop and gets forwarded around it forever — Ethernet frames have no TTL, so nothing ever expires.","Each lap multiplies: within seconds, millions of copies per second — a broadcast storm. MAC tables also thrash as the same source appears on multiple ports.","STP exists exactly for this: switches elect a root bridge, calculate the loop-free tree, and put redundant ports in a blocking state.","When an active link fails, STP unblocks the standby path — redundancy without the storm. Modern RSTP converges in ~1–2 seconds."],
field:"Enable BPDU Guard on access ports: if a switch (or a looped cable) appears where a PC should be, the port err-disables itself instead of melting the floor.",
take:"Redundant L2 links are a storm waiting to happen — STP turns them into safe standby paths.",
q:{t:"ccna",q:"What does STP do with a redundant link between two switches during normal operation?",a:["Load balances traffic across it","Places it in blocking state until an active path fails","Shuts it down permanently","Converts it to a routed link"],c:1,x:"STP blocks the redundant path to keep the topology loop-free, holding it in reserve. Only a failure of an active link brings it into forwarding."}},
{id:"subnet-br",t:"ccna",tag:"Subnetting",title:"Carving one /24 for four departments",diag:"subnet",
story:"A new branch gets 192.168.10.0/24 and has four teams of about 50 people each. You need four clean subnets — and you'll do this math in your head during the exam, so build the reflex now.",
steps:["4 subnets → borrow 2 bits (2² = 4). /24 + 2 = /26. Check hosts: 6 bits left → 62 usable. 50 fits. Done.","Block size is the magic number: 256 − 192 = 64. Networks land at every multiple: .0, .64, .128, .192.","Each subnet's broadcast is the next network minus one (.63, .127, .191, .255); usable range is everything between.","Exam trick: 'what subnet is .100 in?' Find the multiple of 64 at or below it → .64. Instantly: network .64, broadcast .127."],
field:"Real allocations work identically with bigger blocks — the block-size trick is how engineers sanity-check VLSM plans and spot overlapping subnets in tickets.",
take:"Borrowed bits make subnets; leftover bits make hosts; block size tells you where every boundary falls.",
q:{t:"ccna",q:"Using 192.168.10.0/24 split into /26s — which subnet contains the host 192.168.10.150?",a:["192.168.10.64/26","192.168.10.128/26","192.168.10.192/26","192.168.10.0/26"],c:1,x:"Block size 64 → boundaries at .0, .64, .128, .192. The multiple of 64 at or below 150 is 128, so .150 lives in 192.168.10.128/26 (usable .129–.190)."}},
{id:"route-win",t:"ccna",tag:"Route selection",title:"Three routes to the same place — which one wins?",diag:"routes",
story:"A packet for 10.1.1.5 arrives at a router that knows a connected /30, a static /24, and an OSPF /8 that all cover it. New engineers guess wrong here constantly because they reach for AD first.",
steps:["Rule 1 — longest prefix match: the most specific route wins, period. /30 beats /24 beats /8 regardless of source.","Administrative distance only referees when prefix lengths are EQUAL — e.g., an OSPF /24 vs a RIP /24 → OSPF (110 < 120).","Metric is the third tiebreaker: same protocol, same prefix, different paths → lowest metric (or ECMP load-sharing if equal).","So here the connected 10.1.1.4/30 forwards the packet — even though the static route 'looks' more authoritative."],
field:"This is why a rogue more-specific route (a /32 from a misbehaving redistribution, a VPN injecting host routes) can hijack traffic past all your careful AD design — and it's a favorite exam trap.",
take:"Specificity beats trust: longest match first, AD second, metric last.",
q:{t:"ccna",lv:4,q:"A router knows 0.0.0.0/0 via static (AD 1) and 172.16.0.0/16 via OSPF (AD 110). Where does a packet to 172.16.5.9 go?",a:["The static default — AD 1 beats 110","The OSPF route — /16 is more specific than /0","It load balances across both","It gets dropped as ambiguous"],c:1,x:"Prefix length is compared before AD ever enters the picture. /16 covers the destination more specifically than /0, so OSPF wins despite its higher AD."}},
{id:"phish-inv",t:"secplus",tag:"Defense in depth",title:"The invoice email that almost worked",diag:"dnd",
story:"Accounting receives 'URGENT: overdue invoice' from a lookalike domain with a credential-harvesting link. One user clicks. Whether that becomes an incident or a non-event depends on how many layers you stacked.",
steps:["Email filtering catches most lookalike domains — but a fresh domain slipped through.","User training is layer two: three employees reported it; one clicked anyway. Humans are a control, not a guarantee.","The clicked link harvested a password — but MFA blocked the login attempt from the attacker's IP. Attack stopped here.","Had it gone further: least privilege limits what that account reaches, EDR flags follow-on malware, and offline backups make ransomware a bad day instead of a company-ending one."],
field:"Post-incident, report the metric that matters: not 'one user clicked' but 'the control stack held at layer 3.' Defense in depth assumes every individual layer WILL eventually fail.",
take:"Security isn't one wall — it's a stack of imperfect filters that's strong precisely because failures don't align.",
q:{t:"secplus",q:"A user's password is phished, yet the attacker still can't log in. Which control most likely stopped them?",a:["Antivirus","Multi-factor authentication","A stronger password policy","Full disk encryption"],c:1,x:"Password policy can't help once the real password is stolen. MFA requires a second factor the attacker doesn't possess — it's the layer built exactly for this failure."}},
{id:"dmz-web",t:"secplus",tag:"Secure architecture",title:"Where do you put the customer portal?",diag:"dmz",
story:"Your company launches a public web portal. It must be reachable from the whole internet — which makes it the most attacked box you own. Where it lives determines what a breach costs.",
steps:["Placed on the LAN, a compromised portal is an attacker standing inside your network. Unacceptable.","So it goes in a screened subnet (DMZ): the outer firewall permits ONLY 443 from the internet to the web server.","The inner firewall permits ONLY the web server to the database server on its one SQL port — and no DMZ-initiated sessions to the LAN.","When the portal is eventually popped, the attacker is in a small room with locked doors: no RDP to workstations, no file shares, blast radius of one server."],
field:"Review the rulebase from the attacker's chair: 'I own the web box — where can I go?' If the answer is more than the DB port, tighten it. Segmentation is measured by what a compromised host CAN'T do.",
take:"Public services get their own network compartment; firewalls define the only doors in and out.",
q:{t:"secplus",q:"An attacker compromises a DMZ web server and attempts RDP to an internal workstation. What should stop this?",a:["The outer firewall","The inner firewall's deny rules","TLS on the web server","The workstation's password policy"],c:1,x:"The inner firewall is the boundary between DMZ and LAN — its policy should permit only the web-to-DB flow and deny everything else the DMZ initiates."}},
{id:"laptop",t:"secplus",tag:"Data states · encryption",title:"The sales laptop left in an airport taxi",diag:"states",
story:"A rep loses a laptop full of customer data. Whether this is a shrug or a reportable breach comes down to one checkbox IT pushed out a year earlier.",
steps:["Data exists in three states, each with its own protection: at rest (storage), in transit (network), in use (memory).","A stolen laptop is purely an at-rest problem — the thief has the disk, not your network or your running sessions.","Full disk encryption (BitLocker/FileVault) with the key in TPM + PIN means the drive is ciphertext to anyone else. Pulling the disk into another machine yields noise.","Remote wipe via MDM and a revoked certificate finish the job; the incident report reads 'encrypted device lost' — often not even a notifiable breach."],
field:"This is why FDE is table stakes for compliance (HIPAA, PCI, GDPR): the regulation cares whether DATA was exposed, and encryption is what lets you answer 'no.'",
take:"Match the control to the data state: FDE for rest, TLS/VPN for transit, access control for use.",
q:{t:"secplus",q:"Which control renders data unreadable specifically when a powered-off device is stolen?",a:["TLS 1.3","Full disk encryption","A VPN","Screen lock timeout"],c:1,x:"TLS and VPNs protect data in transit; screen locks protect a running session. Only full disk encryption protects data at rest on a powered-off machine."}},
{id:"stuffing",t:"secplus",tag:"Authentication attacks",title:"10,000 login attempts that were all 'correct'",diag:"mfa",
story:"Your SOC sees thousands of logins with VALID usernames and passwords, mostly failing, from IPs worldwide. Nobody brute-forced anything — your users' passwords were reused on a site that got breached.",
steps:["Credential stuffing: attackers replay breached username:password lists against your login page, betting on password reuse. No guessing involved — these were real passwords somewhere.","Rate limiting and lockouts barely help; attempts are distributed across thousands of IPs at low per-IP volume.","MFA converts every 'correct' password into a failed login — the attacker knows, but doesn't have.","Layer on: breached-password screening at password change, and impossible-travel / risk-based conditional access to flag the stragglers."],
field:"The tell in logs: high volume of first-try correct-password failures across many accounts and geographies. That pattern is stuffing, not brute force — and the fix conversation starts with MFA coverage.",
take:"Passwords are shared secrets your users share with other websites. MFA assumes the password is already lost.",
q:{t:"secplus",lv:4,q:"Logins are failing at MFA for many accounts, with correct passwords, from thousands of unrelated IPs. What attack is this?",a:["Brute force","Credential stuffing","Password spraying","Pass-the-hash"],c:1,x:"Correct passwords on the first try at scale = replayed breach data, i.e., credential stuffing. Spraying tries a few common passwords broadly; brute force guesses exhaustively."}},
{id:"bgp-2isp",t:"ccnp",tag:"BGP path control",title:"Two ISPs, and all traffic insists on the slow one",diag:"bgp",
story:"Your company dual-homes to ISP-A (fast, primary) and ISP-B (cheap, backup). Outbound behaves after a local-pref tweak — but inbound traffic keeps arriving via ISP-B. Time to learn which knobs turn which direction.",
steps:["Outbound is easy — it's your own router's choice: set local-preference 200 on routes learned from ISP-A and everything exits there.","Inbound is other people's routing decision. You can't command it, only make one path look worse.","AS-path prepending: advertise your prefixes to ISP-B with your AS number repeated (65100 65100 65100). Distant networks see a longer path via B and prefer A.","If prepending isn't enough (some networks local-pref their customers regardless), advertise more-specific prefixes out the preferred link — longest match beats everything."],
field:"Verify from outside: use a public looking glass to see your prefix's AS-path as the internet sees it. This weight/local-pref = outbound vs prepend/MED/specifics = inbound split is the single most-tested BGP concept.",
take:"BGP gives you dictatorship over outbound and diplomacy over inbound.",
q:{t:"ccnp",q:"Which technique influences how INBOUND traffic from the internet reaches your AS?",a:["Raising local-preference","Setting weight on your edge router","AS-path prepending on advertisements out the backup link","Lowering OSPF cost internally"],c:2,x:"Weight and local-pref only affect your own outbound choices. To shape inbound you alter what you ADVERTISE — prepending makes the backup path look longer to everyone else."}},
{id:"ospf-area",t:"ccnp",tag:"OSPF design",title:"200 routers, one area, constant churn",diag:"area",
story:"A grown-organically campus runs OSPF area 0 everywhere. Every flapping WAN link makes every router in the company rerun SPF. CPU spikes, convergence wobbles — the fix is architecture, not timers.",
steps:["In one area, every router holds the full LSDB and re-runs SPF for ANY topology change anywhere. 200 routers = 200 SPF runs per flap.","Split into areas anchored on area 0: intra-area topology detail (Type 1/2 LSAs) stays inside each area. Other areas see only summaries (Type 3).","Summarize at the ABRs ('area 1 range 10.1.0.0 255.255.0.0'): a flapping /30 inside Area 1 doesn't even generate an update elsewhere.","Make branch areas totally stubby: they receive just a default route — tiny LSDB, instant SPF, and a branch router that can't destabilize the core."],
field:"Design heuristic: areas follow failure domains. Ask 'when this link flaps, who should have to care?' — the answer draws your area borders and summarization points.",
take:"Areas contain both the flood of updates and the blast radius of instability.",
q:{t:"ccnp",q:"What is the primary benefit of splitting a large OSPF domain into multiple areas?",a:["Higher bandwidth on backbone links","Smaller per-router LSDBs and SPF runs contained to the affected area","Automatic encryption between areas","Elimination of the DR/BDR election"],c:1,x:"Areas hide topology detail behind summaries, so routers store less state and only recompute SPF for changes inside their own area — churn stays local."}},
{id:"redist-lp",t:"ccnp",tag:"Redistribution",title:"The route that boomeranged between two protocols",diag:"redist",
story:"After a merger, your OSPF network and their EIGRP network meet at two border routers for redundancy. Days later: intermittent unreachability, routing tables flip-flopping. You've built a route feedback loop.",
steps:["R1 redistributes an OSPF route into EIGRP. It propagates across the EIGRP domain to R2.","R2, seeing an EIGRP route, helpfully redistributes it BACK into OSPF — with fresh seed metrics that can now beat the original. The domains feed each other their own routes.","Fix: at each border, tag on export ('set tag 100') and deny on import ('match tag 100 → deny') using route-maps in both directions.","A route wearing the OSPF-origin tag can never re-enter OSPF. Loop closed — and the tags document route provenance forever."],
field:"Any time redistribution happens at MORE than one point, tags are mandatory, not optional. In tickets, 'flapping routes after adding a second border router' is this exact pattern.",
take:"Mutual redistribution at two points is a loop by default; tags are the circuit breaker.",
q:{t:"ccnp",lv:3,q:"Two routers mutually redistribute OSPF↔EIGRP and routes are flapping. What is the standard fix?",a:["Increase all seed metrics","Tag routes at redistribution and deny that tag on re-import","Remove one of the two border routers","Convert everything to static routes"],c:1,x:"Tagging marks each route's origin domain; denying the tag on the return path stops routes re-entering where they came from — and you keep the redundancy."}},
{id:"bfd-sat",t:"ccnp",tag:"Fast convergence",title:"The failover that took 40 seconds too long",diag:"bfd",
story:"A primary WAN link dies — cleanly enough that the interface stays 'up' (a common failure through carrier gear or satellite modems). OSPF waits for its dead timer while 40 seconds of traffic blackholes into a dead path.",
steps:["Routing protocols only converge after they DETECT failure. Interface-down detection is instant, but a path can die while the local interface stays up.","OSPF's default dead interval is 40 s on broadcast networks — an eternity of dropped traffic.","Cranking hello timers helps (dead ~3 s) but burns CPU and still isn't sub-second.","BFD is a purpose-built, lightweight hello running in the fast path: 3 missed packets at 100 ms intervals = 300 ms detection, and it immediately signals OSPF/BGP/EIGRP to converge."],
field:"Anywhere the physical link state can lie about path health — carrier Ethernet, satellite hops, links through media converters — BFD (or IP SLA tracking for static routes) is the difference between a blip and an outage ticket.",
take:"Convergence speed is capped by detection speed; BFD fixes detection.",
q:{t:"ccnp",q:"A backup route must take over in under a second when the primary path fails WITHOUT the interface going down. Best tool?",a:["Lower the OSPF reference bandwidth","BFD tied to the routing protocol","A second default route","Increase the SPF throttle timer"],c:1,x:"Only BFD detects path death at millisecond scale independent of interface state, then triggers immediate protocol convergence. Timer tuning gets seconds at best."}},
{id:"pan-appid",t:"paloalto",tag:"App-ID vs ports",title:"The rule that allowed 'web' and got you BitTorrent",diag:"panid",
story:"A legacy firewall rule allowed TCP 80/443 outbound — 'web traffic.' The monthly report shows BitTorrent, anonymizers, and a crypto miner all riding those ports. On a Palo Alto, the port was never the point.",
steps:["Port-based rules trust the port number's claim. Anything can speak on 443 — and evasive apps deliberately do.","App-ID inspects the actual traffic (signatures, behavior, TLS metadata) and names the real application regardless of port. BitTorrent-over-443 is identified as bittorrent, not 'ssl'.","Rebuild the rule as: allow applications [web-browsing, ssl] with Service = application-default — the apps you mean, only on their standard ports.","Attach security profiles to the allow rule: App-ID decides WHAT it is; Content-ID scans what you allow for threats. An allow rule without profiles is an uninspected tunnel."],
field:"Migration tip: run new App-ID rules alongside legacy port rules and read the logs — the traffic identified under 'any' will tell you exactly which apps to permit before you tighten.",
take:"Port numbers are a claim; App-ID is a verdict. Write policy in applications, not ports.",
q:{t:"paloalto",q:"Why does 'allow application web-browsing, service application-default' beat 'allow tcp/80'?",a:["It's faster to process","It permits only real web traffic on its standard port — evasive apps on 80 no longer match","It requires no commit","It disables logging overhead"],c:1,x:"The rule now names the application (verified by inspection) AND pins it to default ports. Tunneling apps and port-borrowers fail both tests and fall through to deny."}},
{id:"pan-order",t:"paloalto",tag:"Rule order · shadowing",title:"The rule that never matches",diag:"panzone",
story:"You add a precise rule blocking contractors from the finance servers, commit it, and watch its hit counter stay at zero for a week — while contractors happily reach finance. The rulebase is doing exactly what you told it.",
steps:["PAN-OS evaluates security policy top-down and stops at the FIRST match — rule order IS policy.","Somewhere above your new rule sits a broad allow (trust→dmz any-app). Contractor traffic matches it first; your deny below is shadowed and unreachable.","Fix: specific rules ABOVE broad ones. Move the contractor deny above the general allow — the commit warning about shadowed rules is your friend, not noise.","Remember the invisible floor: intrazone-default (allow) and interzone-default (deny) sit at the very bottom. Override them to enable logging, or denied traffic vanishes without a trace."],
field:"When 'the firewall is ignoring my rule,' check hit counts and run 'test security-policy-match' with the exact flow — it names the rule actually catching the traffic in seconds.",
take:"First match wins: specificity means nothing unless it's ABOVE the broad rule.",
q:{t:"paloalto",q:"Your new specific rule shows zero hits while its traffic is clearly flowing. The classic cause?",a:["Commit failed silently","A broader rule higher in the rulebase matches first, shadowing yours","App-ID can't see the traffic","Hit counters update weekly"],c:1,x:"Shadowing. Evaluation stopped at an earlier match, so your rule is never consulted. Reorder — specific above broad — and confirm with test security-policy-match."}},
{id:"pan-nat",t:"paloalto",tag:"NAT + security policy",title:"Publishing the web server — the rule everyone writes wrong",diag:"pannat",
story:"You publish the new portal: NAT translates public 203.0.113.10 to the DMZ server 10.1.5.20. You write the security rule the 'obvious' way — destination 10.1.5.20, zone DMZ — and the internet gets connection resets. Welcome to the most famous PAN-OS gotcha.",
steps:["Packet arrives: destination 203.0.113.10, ingress zone untrust. The firewall FIRST picks the matching NAT rule — but doesn't translate yet.","The security policy lookup now happens with the ORIGINAL (pre-NAT) destination IP still in the packet…","…but the destination ZONE is derived from where the packet will route AFTER translation: the DMZ.","So the correct security rule is: from untrust, to zone DMZ, destination address 203.0.113.10. Pre-NAT IP, post-NAT zone — write it on a sticky note."],
field:"Interview and exam favorite, and the root cause behind half of all 'my NAT works but traffic is denied' tickets. The NAT rule itself uses pre-NAT zones for both source and destination (untrust→untrust is normal and correct for inbound DNAT).",
take:"Security rules for NATted traffic: PRE-NAT IP, POST-NAT zone.",
q:{t:"paloalto",q:"Inbound DNAT: public 203.0.113.10 → DMZ host 10.1.5.20. The security rule's destination address and zone should be:",a:["10.1.5.20, zone untrust","203.0.113.10, zone DMZ","10.1.5.20, zone DMZ","203.0.113.10, zone untrust"],c:1,x:"Security lookup runs before translation (pre-NAT IP = 203.0.113.10) but with the post-NAT egress zone (DMZ). The 'obvious' 10.1.5.20/DMZ rule never matches."}},
];

function relFor(q){
  const hay=q.q+" "+q.a.join(" ");
  for(const[rx,id]of REL){
    const s=SCEN.find(x=>x.id===id);
    if(!s||s.t!==q.t)continue;          /* only ever suggest a case from the same cert */
    if(rx.test(hay))return s;
  }
  return null;
}

/* ============================ EXPLAIN IT BACK ============================ */
/* Active recall: explain the concept out loud, then compare to the model answer */
const EXPLAIN=[
{id:"ex-osi",t:"netplus",prompt:"Explain the OSI model to a brand-new tech: what does each layer do, and why does the model matter day to day?",
pts:["7 layers from Physical (bits on the wire) up to Application (what users touch); each layer only talks to the layers directly above and below it.","Key jobs: L1 signals · L2 frames/MACs within one hop · L3 IP and routing end-to-end · L4 TCP/UDP ports and delivery · L7 the actual protocols (HTTP, DNS).","It matters because troubleshooting is layered: prove L1 (link light), then L2 (MAC/ARP), then L3 (ping), then L4 (port open), then the app — each passing test eliminates a layer.","Bonus point: MAC addresses change every hop; IP addresses survive end-to-end."]},
{id:"ex-dhcp",t:"netplus",prompt:"Explain how a device gets an IP address with DHCP — and what you see when DHCP fails.",
pts:["DORA: client broadcasts Discover → server unicasts/broadcasts an Offer → client broadcasts Request → server Acknowledges with IP, mask, gateway, DNS, lease time.","Broadcasts don't cross routers, so remote subnets need 'ip helper-address' on their gateway to relay to the DHCP server.","Failure fingerprint: the client self-assigns 169.254.x.x (APIPA) — link-local only, nothing routes.","Troubleshoot: is it one VLAN (relay/helper) or all (server/scope exhausted)?"]},
{id:"ex-tcpudp",t:"netplus",prompt:"Explain TCP vs UDP — and give an example of when each one is the right choice.",
pts:["TCP: connection-oriented (3-way handshake), sequenced, acknowledged, retransmits loss — reliability at the cost of delay. Web, email, file transfer.","UDP: connectionless fire-and-forget — no ordering, no retransmission, minimal overhead. DNS queries, live voice/video, gaming.","The insight: for real-time media a LATE packet is worthless, so retransmitting (TCP) hurts more than losing it (UDP).","Both live at Layer 4 and are distinguished by port numbers."]},
{id:"ex-qos",t:"netplus",prompt:"Explain latency, jitter, and packet loss — and what kind of traffic each one breaks.",
pts:["Latency: total travel time. High latency makes everything feel far away — interactive apps and voice suffer first.","Jitter: VARIATION in arrival timing. Bulk transfers don't care; real-time voice/video turn robotic because they need steady spacing.","Loss: dropped packets. TCP throughput collapses (retransmits); real-time media gets gaps.","Fixes differ: more bandwidth helps loss from congestion; QoS priority queuing fixes jitter; latency is mostly physics plus queuing."]},
{id:"ex-nat",t:"netplus",prompt:"Explain NAT and how PAT lets a whole office share one public IP.",
pts:["Private RFC 1918 addresses aren't routable on the internet, so the edge router rewrites them to a public address on the way out.","PAT (overload): many inside hosts share ONE public IP — the router keeps a table keyed by unique source PORT numbers to sort return traffic.","Consequence: unsolicited inbound connections can't reach inside hosts (no table entry) — accidental security, and why port forwarding exists.","Also why IPv6 reduces the need: enough addresses for everything."]},
{id:"ex-dns",t:"netplus",prompt:"Explain what happens when you type a hostname and DNS resolves it.",
pts:["The OS checks its cache and hosts file, then asks its configured recursive resolver (UDP 53).","The resolver walks the hierarchy if needed: root → TLD (.com) → the domain's authoritative server, then caches the answer per its TTL.","Record types matter: A = IPv4, AAAA = IPv6, CNAME = alias, MX = mail, TXT = policy/verification.","Failure signature: ping by IP works but by name fails → it's DNS."]},
{id:"ex-vlanwhy",t:"ccna",prompt:"Explain what a VLAN actually is — and why two VLANs on the SAME switch can't talk without help.",
pts:["A VLAN is a separate Layer 2 broadcast domain carved out of a switch — logically a separate switch sharing the hardware.","Frames never cross VLANs at L2, even inside one chassis; 802.1Q tags keep them sorted on shared trunk links.","Crossing VLANs requires Layer 3: a router (router-on-a-stick subinterfaces) or an L3 switch with SVIs acting as each VLAN's gateway.","That L3 chokepoint is the feature: it's where ACLs and policy control inter-department traffic."]},
{id:"ex-switch",t:"ccna",prompt:"Explain how a switch learns where devices are and decides where to send each frame.",
pts:["It reads the SOURCE MAC of every arriving frame and records 'this MAC lives on this port' in the MAC address table.","For the DESTINATION: known MAC → forward out that one port; unknown, broadcast, or multicast → flood out every port in the VLAN.","Entries age out (default ~300 s) so moves are handled automatically.","This is why MAC flooding attacks exist: overflow the table and the switch floods everything — port security caps MACs per port."]},
{id:"ex-stp",t:"ccna",prompt:"Explain spanning tree to a junior: the problem it solves, how it decides, and the end result.",
pts:["Problem: Ethernet frames have no TTL, so any L2 loop multiplies broadcasts forever — a storm that flattens the network in seconds.","Election: switches exchange BPDUs and elect a root bridge (lowest priority, then lowest MAC).","Every other switch finds its cheapest path to root; redundant paths get a port put in BLOCKING state.","Result: a loop-free tree with standby links that unblock automatically when an active path fails. RSTP does this in ~1–2 s."]},
{id:"ex-routesel",t:"ccna",prompt:"Explain how a router chooses when it knows several routes covering the same destination.",
pts:["Step 1 — longest prefix match: the most specific route wins regardless of its source. A /30 beats a /24 beats a default.","Step 2 — administrative distance breaks ties between EQUAL prefixes from different sources (connected 0, static 1, eBGP 20, EIGRP 90, OSPF 110, RIP 120).","Step 3 — metric breaks ties within the same protocol; equal metrics can load-share.","Trap to name: people reach for AD first — but a more-specific route from a 'less trusted' source still wins."]},
{id:"ex-subnet",t:"ccna",prompt:"Explain how you'd split 192.168.10.0/24 into four equal subnets — narrating the mental math.",
pts:["Four subnets needs 2 borrowed bits (2²=4): /24 → /26. Six host bits remain → 62 usable each.","Block size: 256 − 192 = 64, so networks land at .0, .64, .128, .192.","Each broadcast is the next network minus 1; usable range is everything between.","Reverse lookup trick: for any host, find the multiple of the block size at or below it — that's its network."]},
{id:"ex-ospfadj",t:"ccna",prompt:"Explain what two OSPF routers must agree on before they'll become neighbors — and the classic failure.",
pts:["Must match: area ID, hello/dead timers, subnet/mask, authentication, area type (stub flags), and MTU.","Must differ: router IDs.","Classic failure: adjacency stuck in EXSTART/EXCHANGE = MTU mismatch — hellos matched, but database exchange packets won't fit.","Verify with 'show ip ospf interface' and 'show ip ospf neighbor' comparing both sides."]},
{id:"ex-cia",t:"secplus",prompt:"Explain the CIA triad with one concrete example of a control for each letter.",
pts:["Confidentiality — only authorized eyes: encryption (TLS, FDE), access controls.","Integrity — data unaltered and trustworthy: hashing, digital signatures, version control.","Availability — there when needed: redundancy, backups, DDoS protection, patching before crashes.","Good habit: classify any incident by which leg(s) it attacks — ransomware hits availability (and often confidentiality via theft)."]},
{id:"ex-crypto",t:"secplus",prompt:"Explain symmetric vs asymmetric encryption — and why TLS uses BOTH.",
pts:["Symmetric (AES): one shared key, very fast — but how do strangers share the key safely?","Asymmetric (RSA/ECC): public/private key pairs solve key exchange and enable signatures — but it's ~1000× slower.","TLS: asymmetric crypto authenticates the server (certificate) and negotiates a session key; then everything switches to fast symmetric encryption with that key.","One line: asymmetric to exchange, symmetric to converse."]},
{id:"ex-did",t:"secplus",prompt:"Explain defense in depth by walking a phishing email through your layers.",
pts:["Email filter catches most; some get through. Training makes users report; someone still clicks.","MFA blocks the stolen password; least privilege limits a compromised account; EDR catches the payload; backups defuse ransomware.","The design assumption: every single layer WILL fail sometimes — safety comes from failures not lining up.","Report incidents by which layer held, not whether the first one failed."]},
{id:"ex-mfa",t:"secplus",prompt:"Explain the three authentication factor types and why MFA specifically kills credential stuffing.",
pts:["Know (password/PIN), Have (phone, token, smart card), Are (biometrics). Two of the SAME type isn't MFA.","Credential stuffing replays real passwords leaked from other sites, betting on reuse — so 'stronger passwords' barely help.","MFA means the correct password alone still fails: the attacker holds the Know factor but not the Have.","Log tell: mass first-try correct-password failures from many IPs = stuffing in progress."]},
{id:"ex-idsips",t:"secplus",prompt:"Explain the difference between an IDS and an IPS — placement, action, and trade-offs.",
pts:["IDS watches a COPY of traffic (SPAN/tap) and alerts — it cannot stop anything; zero risk of blocking good traffic.","IPS sits INLINE in the path and can drop malicious packets in real time — but a false positive now blocks legitimate business.","Tuning is the real work: false positives burn analysts (IDS) or users (IPS); false negatives are the attacks you missed.","Many devices are both — the mode you run is a risk decision."]},
{id:"ex-hash",t:"secplus",prompt:"Explain hashing vs encryption — and what salting adds to password storage.",
pts:["Encryption is two-way: with the key you get the data back. Hashing is one-way: a fixed fingerprint you can verify but not reverse.","So passwords are hashed, not encrypted — the site never needs the password back, just proof you typed the same one.","Rainbow tables precompute hashes of common passwords; a random per-user SALT mixed in before hashing makes every hash unique and tables useless.","Modern practice: slow, salted algorithms (bcrypt/Argon2) so guessing at scale is expensive."]},
{id:"ex-ibgp",t:"ccnp",prompt:"Explain why iBGP requires a full mesh — and how route reflectors remove that requirement.",
pts:["iBGP split horizon: routes learned from one iBGP peer are never re-advertised to another iBGP peer — the loop prevention that eBGP gets from AS-path doesn't exist inside one AS.","Consequence: every iBGP router must peer with every other → n(n−1)/2 sessions. Untenable at scale.","A route reflector is exempt: it reflects routes between its clients (adding originator/cluster IDs for loop safety), so clients only peer with the RR.","Deploy RRs in pairs for redundancy; confederations are the alternative answer."]},
{id:"ex-bgpdir",t:"ccnp",prompt:"Explain which BGP tools steer OUTBOUND traffic vs INBOUND traffic — and why the difference exists.",
pts:["Outbound is your own router's decision → weight (one router) and local-preference (whole AS) command it directly.","Inbound is everyone ELSE's decision → you can only shape what you advertise: AS-path prepending, MED (adjacent AS only), or more-specific prefixes.","Why: BGP routers each pick their own best path; you control your choices, you merely influence theirs.","Most-specific prefixes are the nuclear option — longest match beats every policy."]},
{id:"ex-areas",t:"ccnp",prompt:"Explain what OSPF areas accomplish and what an ABR actually does.",
pts:["Inside an area every router shares the full topology (LSDB) and re-runs SPF on any change — areas shrink both the database and the blast radius of churn.","ABRs sit between an area and area 0, translating topology detail into Type 3 summaries — other areas see routes, not topology.","Summarization at ABRs ('area range') hides internal flaps entirely; stub variants strip external/inter-area routes down to a default.","Design rule: draw area borders where you want failures to stop mattering."]},
{id:"ex-fc",t:"ccnp",prompt:"Explain the EIGRP feasibility condition in plain language — and why it allows instant failover.",
pts:["Feasible distance (FD): my best total cost to the destination. Reported distance (RD): what my neighbor says THEIR cost is.","Feasibility condition: a backup is guaranteed loop-free if its RD < my FD — the neighbor is provably closer than I am, so it can't be routing through me.","Passing routes become feasible successors, pre-installed backups used the instant the successor dies — no queries, no recomputation.","No feasible successor → route goes ACTIVE and queries radiate; that's what stub routers and summarization bound."]},
{id:"ex-tags",t:"ccnp",prompt:"Explain how route tags prevent redistribution loops between two protocols joined at two points.",
pts:["With two border routers, a route exported into domain B can travel across and get re-exported back into domain A with fresh seed metrics — a feedback loop of the domain's own routes.","Fix: on export, a route-map sets a tag (e.g., 100) marking the route's origin domain.","On import at every border, a route-map DENIES routes carrying that tag — origin-domain routes can never re-enter.","Tags travel inside the protocols' route entries, so the policy works at every border consistently — and documents provenance."]},
{id:"ex-bfd",t:"ccnp",prompt:"Explain why fast convergence depends on detection — and what BFD changes.",
pts:["A routing protocol can only reroute after it NOTICES the failure; interface-down is instant, but paths often die while interfaces stay up (carrier gear, converters, satellite links).","Default detection is hello/dead timers — 40 s for OSPF broadcast. Tuning gets seconds, at CPU cost.","BFD is a dedicated micro-hello in the fast path: e.g., 3 × 100 ms = 300 ms detection, then it notifies OSPF/BGP/EIGRP immediately.","Static routes get the same effect from IP SLA probes + tracking. One line: convergence is capped by detection."]},
{id:"ex-panzone",t:"paloalto",prompt:"Explain zones and why Palo Alto policy is written zone-to-zone instead of interface-to-interface.",
pts:["A zone groups interfaces sharing one trust level (trust, untrust, dmz, guest…); policy says which zone pairs may talk and how.","Defaults: traffic between different zones is denied; within a zone it's allowed — override both to add logging.","Zone-based rules survive re-cabling and new interfaces: add an interface to 'trust' and every trust rule already applies.","Policy then layers WHO (User-ID) and WHAT (App-ID) on top of the zone pair — 'contractors in trust may reach dmz intranet apps' reads like the intent."]},
{id:"ex-panappid",t:"paloalto",prompt:"Explain App-ID to someone who's only run port-based firewalls.",
pts:["Port firewalls trust the port's claim; App-ID inspects the traffic itself — signatures, behavior, TLS metadata — and names the real application on ANY port.","So policy is written in applications ('allow web-browsing, ssl') instead of ports, with Service=application-default pinning apps to their standard ports.","Identification is progressive: a session may start as 'ssl' and shift to the specific app as more is seen — policy re-evaluates on the shift.","Application Override skips all of this (pure L4, minimal threat inspection) — a sharp tool for trusted internal apps only."]},
{id:"ex-pannat",t:"paloalto",prompt:"Explain the pre-NAT/post-NAT rule for security policy — the one that breaks everyone's first published server.",
pts:["Order of operations: NAT rule is selected first, but translation hasn't happened when the security lookup runs.","Therefore the security rule matches the ORIGINAL (pre-NAT) destination IP — the public address.","But the destination ZONE is where the packet will end up AFTER translation — the internal zone.","Mantra: pre-NAT IP, post-NAT zone. The NAT rule itself uses pre-NAT zones on both sides (untrust→untrust for inbound DNAT is correct)."]},
{id:"ex-pancommit",t:"paloalto",prompt:"Explain the candidate/commit configuration model and why it exists.",
pts:["Every edit lands in the CANDIDATE config — a staging copy; the firewall keeps enforcing the RUNNING config untouched.","Commit validates the candidate (catching errors, shadowed rules, broken references) and atomically activates it.","Benefits: batch related changes, review a diff before activating, and never run a half-applied policy.","Recovery: config audit shows diffs between versions; 'load config version' + commit rolls back. Panorama adds push scopes on top of the same model."]},
];


/* ============================ COMMAND LAB ============================ */
/* Real CLI practice: task → type the command → checked against accepted forms */
const CMDS=[
{id:"np-ipc",t:"netplus",ps:"C:\\>",task:"A user's PC 'can't reach anything.' Show its full IP configuration including DNS servers and lease info (Windows).",
ac:[/^ipconfig \/all$/],hint:"ipconfig alone hides DNS/DHCP details — there's a switch for everything.",out:"Ethernet adapter Ethernet0: IPv4 169.254.23.101 … DNS Servers: (none)",why:"The /all output instantly reveals the story: an APIPA address and no DNS servers = DHCP never answered. First command of nearly every desktop network ticket."},
{id:"np-ping",t:"netplus",ps:"C:\\>",task:"Test whether the default gateway 192.168.1.1 responds.",
ac:[/^ping 192\.168\.1\.1$/],hint:"The oldest tool in the book.",out:"Reply from 192.168.1.1: bytes=32 time=1ms TTL=64 (4/4 received)",why:"A gateway reply proves L1–L3 to your first hop. Dead gateway + good ipconfig = local network or switch problem, not the internet."},
{id:"np-trace",t:"netplus",ps:"C:\\>",task:"Latency to a cloud app is terrible. Trace the path to 8.8.8.8 to find WHERE it degrades (Windows).",
ac:[/^tracert 8\.8\.8\.8$/],hint:"Windows spells it differently than Linux (traceroute).",out:"1  1ms  192.168.1.1   2  2ms  10.90.0.1   3  184ms  203.0.113.77 …",why:"The hop where latency jumps is where the problem lives — inside your network, at the ISP handoff, or beyond. Screenshot it for the carrier ticket."},
{id:"np-ns",t:"netplus",ps:"C:\\>",task:"Ping by IP works but websites won't load by name. Query DNS directly for example.com.",
ac:[/^nslookup example\.com$/],hint:"The classic DNS interrogation tool.",out:"Server: 192.168.1.1  ·  Name: example.com  Address: 93.184.216.34",why:"Separates 'network is down' from 'DNS is down' in five seconds. If nslookup fails against the default server, retry against 8.8.8.8 to isolate whose resolver is broken."},
{id:"np-flush",t:"netplus",ps:"C:\\>",task:"DNS was fixed server-side but this PC still resolves the old address. Clear its resolver cache.",
ac:[/^ipconfig \/flushdns$/],hint:"Same tool as the first task, different switch.",out:"Successfully flushed the DNS Resolver Cache.",why:"Clients cache answers per TTL — after a record change, stale cache makes a fixed problem look unfixed. Flush before you escalate."},
{id:"np-netstat",t:"netplus",ps:"C:\\>",task:"Something on this machine is holding port 8080. List all connections and listening ports WITH owning process IDs (Windows).",
ac:[/^netstat -ano$/],hint:"Three switches: all, numeric, owning PID.",out:"TCP  0.0.0.0:8080  LISTENING  4312",why:"-ano gives you the PID to chase in Task Manager. Port conflicts and mystery listeners die to this command daily."},
{id:"cc-conft",t:"ccna",ps:"SW1#",task:"You're in privileged EXEC. Enter global configuration mode.",
ac:[/^conf(igure)? ?t(erminal)?$/],hint:"Almost everyone abbreviates it to six letters.",out:"Enter configuration commands, one per line.  SW1(config)#",why:"The gateway to every change. show commands live in EXEC; everything you configure starts here."},
{id:"cc-vlan",t:"ccna",ps:"SW1(config)#",task:"Create VLAN 10 for the Sales team.",
ac:[/^vlan 10$/],hint:"Creating and entering it is one command.",out:"SW1(config-vlan)#   (name SALES to label it)",why:"VLANs must exist before ports can join them — assigning a port to a nonexistent VLAN is a classic silent failure on some platforms."},
{id:"cc-access",t:"ccna",ps:"SW1(config-if)#",task:"You're on interface Gi0/5, a PC port. Hard-set it to access mode (no trunk negotiation).",
ac:[/^switchport mode access$/],hint:"The opposite of trunk mode.",out:"SW1(config-if)#",why:"Hard-setting access mode disables DTP negotiation — a security must (blocks VLAN-hopping setups) and pairs with PortFast + BPDU Guard on user ports."},
{id:"cc-swvlan",t:"ccna",ps:"SW1(config-if)#",task:"Now place this access port in VLAN 10.",
ac:[/^switchport access vlan 10$/],hint:"Follows naturally from the previous command.",out:"SW1(config-if)#",why:"Mode + VLAN assignment are the two lines behind every user port in every office. 'show vlan brief' verifies the result."},
{id:"cc-save",t:"ccna",ps:"SW1#",task:"Your changes work. Save the running config so it survives a reboot.",
ac:[/^copy run(ning-config)? start(up-config)?$/,/^wr(ite)?( mem(ory)?)?$/],hint:"Two accepted answers — the official copy, or the two-letter veteran shortcut.",out:"Building configuration... [OK]",why:"The most expensive command to forget. A power blip months later erases every unsaved change — and nobody remembers what they were."},
{id:"cc-defroute",t:"ccna",ps:"R1(config)#",task:"Give this router a default route via the ISP at 203.0.113.1.",
ac:[/^ip route 0\.0\.0\.0 0\.0\.0\.0 203\.0\.113\.1$/],hint:"Quad-zero network, quad-zero mask, next hop.",out:"R1(config)#   (verify: show ip route → S* 0.0.0.0/0)",why:"The gateway of last resort — matches anything no better route covers. The S* in show ip route confirms it took."},
{id:"cc-shipint",t:"ccna",ps:"R1#",task:"Get the one-line status of every interface: IP, up/down, protocol.",
ac:[/^sh(ow)? ip int(erface)? br(ief)?$/],hint:"Universally abbreviated to 'sh ip int br'.",out:"Gi0/0  10.1.1.1  YES  up  up   ·   Gi0/1  unassigned  YES  admin down  down",why:"The first command on any Cisco box. up/up good; up/down = L2 issue; administratively down = someone typed shutdown."},
{id:"sp-nmap",t:"secplus",ps:"$",task:"Audit host 10.0.0.5: scan its top TCP ports to see what's exposed.",
ac:[/^nmap 10\.0\.0\.5$/,/^nmap -ss 10\.0\.0\.5$/],hint:"The scanner every defender and attacker shares.",out:"22/tcp open ssh · 80/tcp open http · 3389/tcp open ms-wbt-server",why:"Knowing your own exposed surface before attackers do is vulnerability management 101. RDP open to the world (3389) is the kind of finding this surfaces. Only scan what you're authorized to."},
{id:"sp-hash",t:"secplus",ps:"$",task:"Prove the evidence file evidence.img hasn't been altered: compute its SHA-256 hash.",
ac:[/^sha256sum evidence\.img$/],hint:"The tool is named after the algorithm.",out:"9f86d081884c7d65…  evidence.img",why:"Hash at collection, hash at analysis — matching values prove integrity for chain of custody. The same technique verifies downloaded ISOs and patches."},
{id:"sp-ssh",t:"secplus",ps:"$",task:"Connect securely to the jump box at 10.0.0.9 as user admin.",
ac:[/^ssh admin@10\.0\.0\.9$/,/^ssh -l admin 10\.0\.0\.9$/],hint:"user@host is the common form.",out:"admin@10.0.0.9's password:",why:"SSH replaced telnet precisely because credentials and sessions are encrypted end to end. The @ syntax is muscle memory worth building."},
{id:"sp-tail",t:"secplus",ps:"$",task:"Review the 50 most recent authentication events on this Linux server.",
ac:[/^tail -n ?50 \/var\/log\/auth\.log$/,/^tail -50 \/var\/log\/auth\.log$/],hint:"The log lives in /var/log/auth.log; tail shows the end of it.",out:"Failed password for root from 203.0.113.55 port 51022 ssh2  (×47)",why:"Brute-force attempts, sudo usage, and new sessions all land here. 47 failures from one IP = time for fail2ban and a firewall rule."},
{id:"sp-ss",t:"secplus",ps:"$",task:"List every listening TCP socket and the process that owns it (modern Linux tool).",
ac:[/^(sudo )?ss -tlnp$/],hint:"netstat's successor; flags: tcp, listening, numeric, processes.",out:'LISTEN 0.0.0.0:443 users:("nginx",pid=812)',why:"Unknown listeners are how you find backdoors, forgotten services, and shadow IT. Baseline this output; investigate anything new."},
{id:"sp-chmod",t:"secplus",ps:"$",task:"secrets.txt is world-readable. Restrict it so ONLY the owner can read and write.",
ac:[/^chmod 600 secrets\.txt$/],hint:"Owner rw, group nothing, others nothing — in octal.",out:"$ ls -l secrets.txt  →  -rw-------",why:"600 = owner rw only. Least privilege applies to files too — SSH won't even use a private key that's world-readable, for exactly this reason."},
{id:"cp-ospfnei",t:"ccnp",ps:"R1#",task:"An OSPF route vanished. First move: check neighbor adjacencies and their states.",
ac:[/^sh(ow)? ip ospf nei(ghbor)?$/],hint:"Neighbors first, database second.",out:"10.0.0.2  1  FULL/DR  00:00:36  Gi0/0",why:"FULL is healthy. Stuck in EXSTART/EXCHANGE = MTU mismatch; INIT = one-way hellos; missing entirely = timers/area/auth mismatch. The state names the disease."},
{id:"cp-bgpsum",t:"ccnp",ps:"R1#",task:"Verify the health of all BGP sessions at a glance.",
ac:[/^sh(ow)? ip bgp sum(mary)?$/],hint:"One line per neighbor.",out:"203.0.113.2  4  65001  …  Up/Down 5d02h  State/PfxRcd 842001",why:"A number in the last column = Established and that many prefixes received. A word (Idle, Active) = the session is down and the word tells you where in the state machine it's dying."},
{id:"cp-route",t:"ccnp",ps:"R1#",task:"Traffic to 10.5.5.5 takes a weird path. Ask the router exactly which route it's using for that destination.",
ac:[/^sh(ow)? ip route 10\.5\.5\.5$/],hint:"Query the table for the specific address, not the whole table.",out:'Routing entry for 10.5.5.4/30 — known via "connected"',why:"The router resolves longest-prefix-match for you and shows the winner with its source and metric — settles 'which route wins' debates instantly."},
{id:"cp-ospfint",t:"ccnp",ps:"R1#",task:"That EXSTART-stuck neighbor from earlier: display OSPF interface details to compare MTU and timers.",
ac:[/^sh(ow)? ip ospf int(erface)?( \S+)?$/],hint:"Same family as the neighbor command.",out:"Gi0/0 MTU 9000, Hello 10, Dead 40, Cost 1  ← peer shows MTU 1500",why:"EXSTART hangs are MTU mismatches until proven otherwise. This output on both routers side-by-side is the proof."},
{id:"cp-bfd",t:"ccnp",ps:"R1(config-router)#",task:"You're under 'router ospf 1'. Enable BFD fast failure detection on all OSPF interfaces.",
ac:[/^bfd all-interfaces$/],hint:"Two words, exactly what it says.",out:"R1(config-router)#   (interfaces also need: bfd interval 100 min_rx 100 multiplier 3)",why:"This one line subscribes OSPF to BFD's sub-second detection — 40-second blackholes become 300 ms blips."},
{id:"cp-settag",t:"ccnp",ps:"R1(config-route-map)#",task:"Inside route-map RM-TO-EIGRP (used at redistribution), tag routes with 100 so the far border can block re-import.",
ac:[/^set tag 100$/],hint:"The match/set grammar of route-maps.",out:"R1(config-route-map)#   (far side: match tag 100 → deny)",why:"The export half of the redistribution-loop fix. Tag on the way out, deny that tag on the way back in — at every border."},
{id:"pa-testpol",t:"paloalto",ps:"admin@PA>",task:"A user swears the firewall blocks them. Ask the rulebase which security rule a flow from 10.1.1.5 to 8.8.8.8 would hit.",
ac:[/^test security-policy-match source 10\.1\.1\.5 destination 8\.8\.8\.8.*$/],hint:"test security-policy-match source … destination …",out:'"outbound-dns" { from trust; to untrust; action allow; }',why:"Ends every 'which rule is eating my traffic' debate in one line — faster and more authoritative than reading the rulebase by eye."},
{id:"pa-sess",t:"paloalto",ps:"admin@PA>",task:"Display the live session table to see what's flowing through the firewall right now.",
ac:[/^show session all$/],hint:"Sessions, all of them.",out:"ID 20841  vsys1  dns  10.1.1.5[54021] → 8.8.8.8[53]  FLOW",why:"Live proof of what the firewall is actually passing, with the App-ID per session. Filter variants (show session all filter …) narrow to one host during incidents."},
{id:"pa-commit",t:"paloalto",ps:"admin@PA#",task:"Your candidate config is ready. Activate it.",
ac:[/^commit$/],hint:"One word — the whole PAN-OS change model hinges on it.",out:"Commit job 42 … 100% Configuration committed successfully",why:"Nothing you configure exists to traffic until this runs. Validation errors and shadowed-rule warnings surface here — read them."},
{id:"pa-ping",t:"paloalto",ps:"admin@PA>",task:"From the firewall itself, test reachability to 8.8.8.8 (PAN-OS syntax differs from IOS).",
ac:[/^ping host 8\.8\.8\.8$/],hint:"PAN-OS requires a keyword before the address.",out:"64 bytes from 8.8.8.8: icmp_seq=1 ttl=117 time=8.2 ms",why:"'ping host X' (with optional 'source Y') tests the data plane's own reachability — key when service routes send firewall traffic out data interfaces."},
{id:"pa-sysinfo",t:"paloalto",ps:"admin@PA>",task:"Grab the box's identity for a support case: model, serial, PAN-OS version, uptime.",
ac:[/^show system info$/],hint:"The 'who am I' of PAN-OS.",out:"model: PA-3220 · serial: 0123456789 · sw-version: 11.1.2 · uptime: 84 days",why:"First paste into every TAC case, and the fastest way to confirm version before checking a bug or planning an upgrade."},
];

/* ---- Arista EOS ---- */
const CMDX=[
{id:"ar-ver",t:"arista",ps:"sw1#",task:"Confirm the EOS version and hardware model before a planned upgrade.",
ac:[/^sh(ow)? version$/],hint:"Same verb Cisco uses.",out:"Arista DCS-7050SX3-48YC8 · EOS 4.30.4M · Uptime 61 days",why:"Arista deliberately mirrors Cisco's CLI, so most show commands transfer directly. The model line matters here — EOS features vary by platform."},
{id:"ar-intstat",t:"arista",ps:"sw1#",task:"List every port with its link status, VLAN, duplex and speed in one table.",
ac:[/^sh(ow)? int(erfaces)? status$/],hint:"show interfaces … status",out:"Et1 connected 10 full 25G · Et2 notconnect 1 auto auto",why:"'connected' vs 'notconnect' vs 'errdisabled' is your fastest read of a whole switch. This is the command you run before anything else on a port complaint."},
{id:"ar-lldp",t:"arista",ps:"sw1#",task:"Find out which device is plugged into each port (vendor-neutral discovery).",
ac:[/^sh(ow)? lldp neighbors$/],hint:"Not CDP — the open standard.",out:"Et49  spine1  Ethernet1/1 · Et50  spine2  Ethernet1/1",why:"LLDP (802.1AB) is the multi-vendor answer to CDP, and it's what you'll use in any mixed Arista/Cisco/Juniper fabric to build a real topology map."},
{id:"ar-session",t:"arista",ps:"sw1#",task:"Start a named configuration session so your changes can be reviewed before they apply.",
ac:[/^configure session \S+$/],ans:"configure session fix-uplink",hint:"configure session <name> — any label you like",out:"sw1(config-s-name)#",why:"EOS's answer to Junos-style safety: changes stage in a session, you diff them, then commit. Plain 'configure terminal' still applies immediately — the session is the safer habit."},
{id:"ar-diff",t:"arista",ps:"sw1(config-s-fix)#",task:"Show exactly what this session would change before you apply it.",
ac:[/^sh(ow)? session-config diffs$/],hint:"session-config … diffs",out:"+ interface Ethernet5\\n+   description uplink-core",why:"A diff before commit is the single best habit in network change control — it catches the typo you didn't see and gives you something to paste in the change ticket."},
{id:"ar-commit",t:"arista",ps:"sw1(config-s-fix)#",task:"Apply the reviewed session to the running config.",
ac:[/^commit$/],hint:"One word.",out:"sw1#",why:"Commit moves the whole session in atomically — no half-applied configs. 'commit timer 5' auto-reverts if you don't confirm, which saves you when a change cuts your own management path."},
{id:"ar-json",t:"arista",ps:"sw1#",task:"Return interface status as machine-readable JSON for a monitoring script.",
ac:[/^sh(ow)? int(erfaces)? status \| json$/],hint:"Pipe into json.",out:'{"interfaceStatuses":{"Ethernet1":{"linkStatus":"connected"...',why:"Every EOS show command can emit JSON — the foundation of Arista automation (eAPI). It's why scripts against EOS don't need screen-scraping."},
{id:"ar-bash",t:"arista",ps:"sw1#",task:"Drop to the underlying Linux shell for a packet capture.",
ac:[/^bash$/],hint:"It's literally the shell's name.",out:"[admin@sw1 ~]$",why:"EOS runs on unmodified Linux, so tcpdump, python, and normal filesystem tools are right there. That architectural choice is Arista's core differentiator."},

/* ---- Juniper Junos ---- */
{id:"jn-terse",t:"juniper",ps:"user@mx>",task:"Get a compact list of all interfaces with admin/link state and addresses.",
ac:[/^sh(ow)? int(erfaces)? terse$/],hint:"Junos's word for 'brief'.",out:"ge-0/0/0.0  up  up  inet 10.1.1.1/24",why:"The Junos equivalent of 'show ip interface brief'. Two columns: admin status then link status — same read as Cisco's up/up."},
{id:"jn-route",t:"juniper",ps:"user@mx>",task:"Display the routing table.",
ac:[/^sh(ow)? route$/],hint:"Shorter than you'd expect — no 'ip'.",out:"10.1.1.0/24  *[Direct/0] via ge-0/0/0.0",why:"Junos drops 'ip' because it's protocol-family aware by default. The asterisk marks the active route; the bracket shows protocol and preference (Junos's word for administrative distance)."},
{id:"jn-conf",t:"juniper",ps:"user@mx>",task:"Enter configuration mode.",
ac:[/^configure$/,/^edit$/],hint:"One word — and note the prompt changes from > to #.",out:"Entering configuration mode  [edit]  user@mx#",why:"In Junos, > is operational mode and # is configuration mode — the opposite convention from Cisco, where # means privileged EXEC. Misreading that prompt is the classic first-day mistake."},
{id:"jn-setip",t:"juniper",ps:"user@mx# ",task:"Give ge-0/0/0 unit 0 the address 10.1.1.1/24.",
ac:[/^set interfaces ge-0\/0\/0 unit 0 family inet address 10\.1\.1\.1\/24$/],hint:"set interfaces <if> unit 0 family inet address <ip/len>",out:"[edit] user@mx#",why:"Junos config is one hierarchy edited with 'set' statements. 'unit 0' is the logical interface (Cisco's subinterface), and 'family inet' means IPv4 — inet6 for v6."},
{id:"jn-compare",t:"juniper",ps:"user@mx# ",task:"Review your pending changes against the active config before applying.",
ac:[/^show \| compare$/],hint:"Pipe show into compare.",out:"[edit interfaces ge-0/0/0]\\n+   unit 0 { family inet { address 10.1.1.1/24; } }",why:"Junos's killer feature: nothing you type is live until commit, and this shows the exact diff. + is what you're adding, - what you're removing."},
{id:"jn-commitc",t:"juniper",ps:"user@mx# ",task:"Apply the change, but auto-roll-back in 5 minutes unless you confirm.",
ac:[/^commit confirmed 5$/],hint:"commit confirmed <minutes>",out:"commit confirmed will be automatically rolled back in 5 minutes unless confirmed",why:"The command that saves careers. If your change severs your own access, the router undoes it by itself. Type 'commit' again within the window to make it permanent."},
{id:"jn-rollback",t:"juniper",ps:"user@mx# ",task:"Discard your candidate changes and return to the last committed config.",
ac:[/^rollback 0$/,/^rollback$/],hint:"rollback 0 = back to the active config.",out:"load complete",why:"Junos keeps up to 50 previous commits: rollback 1 is the config before the last commit, rollback 0 discards uncommitted edits. Real undo, built in."},
{id:"jn-bgp",t:"juniper",ps:"user@mx>",task:"Check the state of all BGP peers.",
ac:[/^sh(ow)? bgp summary$/],hint:"No 'ip' in Junos.",out:"Peer 203.0.113.2  AS 65001  State: Established  Active/Received/Accepted 842001",why:"Same information as Cisco's 'show ip bgp summary'. Look for Established plus a sane prefix count; anything else means the session is cycling."},
{id:"jn-ospf",t:"juniper",ps:"user@mx>",task:"Verify OSPF adjacencies and their states.",
ac:[/^sh(ow)? ospf neighbor$/],hint:"Drop the 'ip'.",out:"10.0.0.2  ge-0/0/0.0  Full/DR  38  1",why:"'Full' is healthy, exactly as on Cisco. The protocol is standardized — only the CLI grammar changes between vendors, which is the whole point of learning the concept first."},

/* ---- Nokia SR OS ---- */
{id:"nk-rint",t:"nokia",ps:"A:SR1#",task:"List the router's Layer 3 interfaces with their addresses and state.",
ac:[/^show router interface$/],hint:"Everything L3 lives under 'router' in SR OS.",out:"to-core  Up/Up  10.0.0.1/30  1/1/1",why:"SR OS separates PORTS (physical) from ROUTER INTERFACES (logical L3). This shows the logical side — the equivalent of 'show ip interface brief'."},
{id:"nk-port",t:"nokia",ps:"A:SR1#",task:"Now check the physical ports — link state, speed, and any errors.",
ac:[/^show port$/],hint:"The physical half of the previous command.",out:"1/1/1  Up  Yes  Up  9212  9212  100G",why:"The port/interface split is SR OS's core mental model: a port can be up while no router interface is bound to it. Check both halves before declaring a link healthy."},
{id:"nk-route",t:"nokia",ps:"A:SR1#",task:"Display the IPv4 routing table.",

{id:"nk-save",t:"nokia",ps:"A:SR1#",task:"Save the running configuration so it survives a reboot.",

{t:"netplus",lv:1,d:"Fundamentals",q:"On which UDP port does a DHCP SERVER listen?",a:["68","67","53","69"],c:1,x:"Servers listen on 67, clients on 68 — the pair you'll see in packet captures of DORA. 69 is TFTP, 53 is DNS."},
{t:"netplus",lv:1,d:"Implementation",q:"Which device bridges wireless clients onto the wired LAN?",a:["Router","Access point","Modem","Repeater"],c:1,x:"An AP is fundamentally a wireless-to-wired bridge — clients associate over RF and their frames land on the Ethernet segment (and VLAN) behind it."},

{t:"netplus",lv:2,d:"Implementation",q:"What does link aggregation (LAG/port channel) provide?",a:["Longer cable runs","Combined bandwidth and redundancy across multiple physical links","Wireless mesh routing","Automatic VLAN creation"],c:1,x:"Bundled links act as one logical interface: traffic is hashed across members, and a member failure just shrinks capacity instead of dropping the link."},
{t:"netplus",lv:2,d:"Fundamentals",q:"The mask 255.255.240.0 in CIDR notation is:",a:["/19","/20","/21","/24"],c:1,x:"255.255.240.0 = 8+8+4 network bits = /20. The 240 in the third octet means block size 16 there — worth memorizing alongside 224(/19) and 248(/21)."},
{t:"netplus",lv:2,d:"Troubleshooting",q:"A packet larger than the path's MTU has the Don't Fragment bit set. What happens?",a:["It's fragmented anyway","It's dropped and an ICMP 'Fragmentation Needed' goes back to the sender","It's queued until MTU increases","The TTL is reset"],c:1,x:"That ICMP message drives Path MTU Discovery. Firewalls that block ICMP break PMTUD — causing the classic 'small packets work, big transfers hang' symptom."},
{t:"netplus",lv:3,d:"Troubleshooting",q:"On VPN, users reach internal servers by IP but not by hostname. First thing to check?",a:["The VPN's encryption cipher","Whether the VPN assigns internal DNS servers to clients","The server's default gateway","Cable quality"],c:1,x:"Reach-by-IP proves the tunnel and routing work; failing names points at resolution. VPN clients must receive (and use) internal DNS servers for internal zones — split-DNS misconfig is the usual culprit."},
{t:"netplus",lv:3,d:"Troubleshooting",q:"Breakroom Wi-Fi drops every time someone heats lunch. The cleanest fix?",a:["Increase AP transmit power","Move those clients/AP to 5 GHz","Change the SSID","Shorten the DHCP lease"],c:1,x:"Microwave ovens blast the 2.4 GHz band. More power just shouts into the noise; 5 GHz sidesteps the interference entirely — the general lesson: identify the interferer, change bands."},
{t:"ccna",lv:1,d:"Network Access",q:"Which table does a switch consult to forward a unicast frame?",a:["Routing table","MAC address (CAM) table","ARP table","NAT table"],c:1,x:"The switch looks up the destination MAC in its CAM table: known → one port; unknown → flood the VLAN. Routers use routing tables; hosts use ARP tables."},

{t:"ccna",lv:2,d:"IP Connectivity",q:"What is a floating static route?",a:["A route without a next hop","A backup static route given a higher AD so it only installs when the primary route disappears","A route that load balances","An IPv6-only route type"],c:1,x:"Example: primary via OSPF (AD 110), backup 'ip route ... 250'. The floating static stays out of the table until the better route vanishes — instant, protocol-free failover."},
