{t:"ccna",lv:4,d:"Security",q:"What does 'switchport port-security mac-address sticky' do?",a:["Blocks all MACs","Dynamically learns connected MACs and writes them into the running config as secure entries","Encrypts MAC addresses","Ages out entries hourly"],c:1,x:"Sticky learning captures whatever's plugged in now as the permitted device(s) — save the config and the binding survives reboots. Moves and replacements then require deliberate config changes."},
{t:"secplus",lv:1,d:"Operations",q:"Shredding printed documents before disposal defends against:",a:["Shoulder surfing","Dumpster diving","Phishing","Tailgating"],c:1,x:"Dumpster diving harvests discarded org charts, invoices, and credentials for social engineering. Cross-cut shredders and locked disposal bins are the boring, effective control."},
{t:"secplus",lv:1,d:"Threats",q:"Malware that encrypts your files and demands payment is:",a:["A rootkit","Ransomware","A logic bomb","Spyware"],c:1,x:"Ransomware monetizes availability: encrypt data, sell it back. Modern crews also exfiltrate first (double extortion) — which is why 'we have backups' no longer ends the conversation."},
{t:"secplus",lv:2,d:"Operations",q:"How does EDR differ from traditional antivirus?",a:["It only scans email","It watches endpoint BEHAVIOR (processes, connections) to detect and respond to novel attacks, beyond file signatures","It replaces firewalls","It's cloud antivirus"],c:1,x:"Signatures only catch known files. EDR records behavior — a Word doc spawning PowerShell that reaches the internet gets flagged regardless of hashes, and responders can isolate the host remotely."},
{t:"secplus",lv:2,d:"Concepts",q:"What does Single Sign-On (SSO) provide?",a:["A single password reused everywhere","One authentication event granting access to many applications via a trusted identity provider","Biometric-only login","Password-less networks"],c:1,x:"With SAML/OIDC, apps trust the IdP's assertion instead of holding passwords. One strong login (with MFA) protects everything — and one place to revoke access when someone leaves."},
{t:"secplus",lv:2,d:"Operations",q:"Why mask or tokenize production data before loading it into a test environment?",a:["Tests run faster","Test systems have weaker controls — masking removes the sensitive values so a test-env breach exposes nothing real","It compresses the database","Developers prefer fake names"],c:1,x:"Non-prod environments are breach magnets: broad access, weak logging. Masking/tokenization keeps data SHAPED right for testing while making it worthless to steal."},
{t:"secplus",lv:3,d:"Threats",q:"Why does a pass-the-hash attack work against NTLM?",a:["Hashes are short","NTLM authenticates using the hash itself — possessing the hash is as good as the password","NTLM has no server side","Hashes are transmitted in DNS"],c:1,x:"The stolen hash IS the credential; no cracking required. Mitigations: kill NTLM where possible, LAPS for local admins, tiered admin accounts, Credential Guard."},
{t:"secplus",lv:3,d:"Threats",q:"An attacker registers 'gooogle.com' hoping victims mistype. This is:",a:["Pharming","Typosquatting","Session hijacking","DNS tunneling"],c:1,x:"Typosquatting weaponizes fat fingers for phishing pages and malware. Defenders register common typos of their own brand and monitor lookalike-domain feeds."},
{t:"secplus",lv:4,d:"Threats",q:"A 'golden ticket' attack lets an attacker forge access to anything in the domain. What did they compromise?",a:["The CEO's laptop","The Kerberos KRBTGT account hash, enabling forged TGTs","The DNS server","A single service password"],c:1,x:"KRBTGT signs every Kerberos ticket; with its hash, attackers mint their own TGTs as anyone, with any lifetime. Recovery requires rotating KRBTGT twice — a full domain-compromise scenario."},
{t:"ccnp",lv:2,d:"OSPF",q:"Modern links all show OSPF cost 1 (10G = 1G = 1). The proper fix?",a:["Static costs everywhere","Raise 'auto-cost reference-bandwidth' (e.g., to 100000) on ALL routers","Disable cost calculation","Use hop count instead"],c:1,x:"Reference bandwidth defaults to 100 Mb/s, so everything faster floors at cost 1 and OSPF can't prefer 10G over 1G. Raise it consistently domain-wide or metrics disagree."},
{t:"ccnp",lv:2,d:"Path Control",q:"For filtering ROUTES (not packets), why prefer a prefix-list over an ACL?",a:["ACLs can't match IPs","Prefix-lists match both the prefix AND its length range (ge/le) cleanly and process efficiently","Prefix-lists encrypt updates","ACLs are deprecated entirely"],c:1,x:"'permit 10.0.0.0/8 ge 24' expresses 'any /24-or-longer inside 10/8' — awkward or impossible with ACL wildcards. Route filtering is what prefix-lists were built for."},
{t:"ccnp",lv:3,d:"BGP",q:"You changed an inbound BGP policy. How do you apply it without tearing down the session?",a:["reload","A route refresh / soft reset (clear ip bgp x.x.x.x soft in)","Delete and re-add the neighbor","Wait for the next keepalive"],c:1,x:"Hard-clearing a session drops every prefix and disrupts traffic. Route refresh re-requests the neighbor's routes so new policy applies with zero downtime — the only acceptable method in production."},
{t:"ccnp",lv:3,d:"EIGRP",q:"What does EIGRP 'variance 2' enable?",a:["Doubled hello rate","Unequal-cost load balancing across feasible successors within 2× the best metric","Two router IDs","Backup stub routing"],c:1,x:"Variance multiplies the best metric; loop-free paths (feasibility condition holders) under that ceiling get installed and share load proportionally — a capability OSPF lacks natively."},
{t:"ccnp",lv:3,d:"OSPF",q:"What problem does the Type 4 (ASBR Summary) LSA solve?",a:["Advertising stub networks","Telling OTHER areas how to reach the ASBR so their routers can resolve Type 5 external routes","Compressing Type 1 LSAs","Electing the DR"],c:1,x:"Type 5s name the ASBR as origin, but routers in other areas have no intra-area route to it. ABRs inject Type 4s — 'the ASBR is this way' — completing the recursion."},
{t:"ccnp",lv:4,d:"BGP",q:"'aggregate-address 10.0.0.0 255.255.0.0 summary-only' does what?",a:["Blocks the range","Advertises the /16 summary and SUPPRESSES the component prefixes","Doubles the advertisement","Creates a static route only"],c:1,x:"Without summary-only you'd advertise the aggregate AND the specifics (longest match makes the summary pointless). Suppression is the point — fewer prefixes upstream, contained flaps."},
{t:"ccnp",lv:4,d:"BGP",q:"What's the operational risk of aggressive BGP dampening?",a:["Higher CPU only","A prefix that flapped during an incident stays suppressed AFTER recovery — self-inflicted unreachability","It disables MED","Sessions reset hourly"],c:1,x:"Dampening penalizes flapping prefixes, but penalties decay slowly: your customer's route can remain suppressed at ISPs long after their link stabilizes. Modern guidance uses gentle parameters or none."},
{t:"ccnp",lv:2,d:"Services",q:"'standby 1 track GigabitEthernet0/1 30' on an HSRP router does what?",a:["Pings the peer every 30 s","Decrements HSRP priority by 30 if the tracked uplink fails, letting the peer take over","Delays failover 30 s","Adds 30 backup routers"],c:1,x:"Gateway redundancy is pointless if the active router's UPLINK dies while its LAN leg stays up. Tracking couples HSRP role to upstream health — priority drops, the healthy peer preempts."},
{t:"paloalto",lv:1,d:"Fundamentals",q:"What is the default superuser account on PAN-OS?",a:["root","admin","panadmin","administrator"],c:1,x:"admin/admin out of the box — changing it is literally step one of initial config, and audits still find defaults in the wild."},
{t:"paloalto",lv:2,d:"Threat Prevention",q:"What does a URL Filtering profile control?",a:["NAT order","Which web categories (gambling, malware, file-sharing…) are allowed, alerted, or blocked on traffic a rule permits","BGP route filtering","VPN encryption ciphers"],c:1,x:"Attached to allow rules like other profiles, it applies per-category actions — and 'alert' mode first gives you visibility into what users actually browse before you block."},
{t:"paloalto",lv:2,d:"Networking",q:"What is TAP mode used for?",a:["High availability","Passive visibility: the firewall analyzes a SPAN/mirror copy of traffic — full App-ID/threat logs, zero enforcement","Faster commits","Wireless management"],c:1,x:"TAP mode is the classic evaluation deployment: mirror a core switch port to it and get weeks of application and threat visibility with no risk to production traffic."},
{t:"paloalto",lv:2,d:"Networking",q:"Virtual Wire (vwire) deployment mode means:",a:["A VPN tunnel type","The firewall sits transparently between two segments — no IP changes, no routing, full inspection","Management over Wi-Fi","A Panorama connection"],c:1,x:"Vwire binds two interfaces into a bump-in-the-wire: drop it inline in front of an existing router without re-addressing anything. Full policy and inspection, invisible at L3."},
{t:"paloalto",lv:3,d:"Policies",q:"Why is 'log at session END' the default recommendation over session start?",a:["It uses less disk","End logs include the final App-ID (after shifts), bytes, and duration — the complete story of the session","Start logs are encrypted","End logs commit faster"],c:1,x:"An app identified as 'ssl' at start may end as 'facebook-base'; only the end log reflects it, plus byte counts for investigations. Add start-logging selectively for long-lived tunnels you can't wait on."},
{t:"paloalto",lv:3,d:"User-ID",q:"When does User-ID fall back to Captive Portal?",a:["Every login, always","When no IP-to-user mapping exists (unmanaged/BYOD device) — the browser session authenticates the user and creates one","Only for VPN users","When Panorama is offline"],c:1,x:"Agent and log-based mapping cover domain machines; the guest laptop has no mapping until Captive Portal challenges the browser and ties the IP to an identity."},
{t:"paloalto",lv:4,d:"Networking",q:"What does Policy-Based Forwarding (PBF) let you do?",a:["Skip the security rulebase","Override the virtual router's routing decision per rule — e.g., send this app or source out a specific ISP","Encrypt routing updates","Forward logs to Panorama"],c:1,x:"PBF is PAN-OS's policy routing: match on zone/source/app and pick the egress interface + next hop, with monitoring to fail back. Classic use: guest traffic out the cheap ISP, voice out the good one."},
{t:"paloalto",lv:4,d:"HA",q:"With HA link monitoring configured, what triggers a failover?",a:["High CPU","A monitored data interface (or link group) going down on the active unit","A failed login","Log disk filling"],c:1,x:"Heartbeats catch dead boxes; link (and path) monitoring catches a live box that lost its important links. The active unit self-demotes so the peer with working links takes over."},
];

/* ============================ KNOWLEDGE OF THE DAY ============================ */
const KOTD=[
{t:"netplus",k:"TTL isn't time — it's hops",v:"The IP TTL field decrements at each router; at zero the packet dies and an ICMP Time Exceeded goes back. Traceroute is just deliberate TTL abuse: TTL 1, 2, 3… mapping each hop from the error replies."},
{t:"ccna",k:"'up/down' has exactly one meaning",v:"In show ip interface brief, the first column is physical (L1), the second is line protocol (L2). up/down = wire fine, L2 broken (encapsulation, keepalives). down/down = physical. administratively down = someone typed shutdown."},
{t:"secplus",k:"Salting isn't secret",v:"A password salt is stored in plaintext right next to the hash — and that's fine. Its job isn't secrecy; it's uniqueness: identical passwords produce different hashes, and precomputed rainbow tables become worthless."},
{t:"ccnp",k:"BGP trusts you more than your neighbor",v:"Weight (Cisco-proprietary, local to one router) outranks everything in best-path selection, then local-preference (AS-wide). Both only shape OUTBOUND traffic — inbound requires persuasion: prepending, MED, or more-specific prefixes."},
{t:"paloalto",k:"Pre-NAT IP, post-NAT zone",v:"The PAN-OS security lookup runs before translation but after route lookup: match the ORIGINAL destination IP with the FINAL destination zone. Half of all 'NAT works but traffic denied' tickets are this one sentence."},
{t:"netplus",k:"169.254 is a confession",v:"An APIPA address means the host asked for DHCP and nobody answered. It's never the answer to 'why is my network slow' — it's the answer to 'why do I have no network at all.'"},
{t:"ccna",k:"The invisible deny",v:"Every Cisco ACL ends with an implicit 'deny any' you can't see. An ACL that only lists denies therefore blocks everything. Add 'permit ip any any' explicitly — or better, log the denies so you can see what you're dropping."},
{t:"secplus",k:"MFA assumes the password is already stolen",v:"That's the design philosophy, not pessimism. Credential stuffing replays real passwords from other breaches — so the second factor must be a separate theft entirely. Two knowledge factors (password + PIN) is not MFA."},
{t:"ccnp",k:"Convergence is capped by detection",v:"OSPF can't reroute around a failure it hasn't noticed. Interfaces can stay 'up' while the path is dead (carrier gear, satellite links). BFD's 3×100 ms micro-hellos turn 40-second blackholes into 300 ms blips."},
{t:"paloalto",k:"An allow rule without profiles is a tunnel",v:"App-ID decides WHAT the traffic is; Content-ID (AV, vulnerability, URL, WildFire profiles) scans what you permit. Security profiles attach to ALLOW rules — denied traffic needs no scanning, allowed traffic always does."},
{t:"netplus",k:"Jitter kills voice, not bandwidth",v:"VoIP needs a packet every 20 ms to ARRIVE every 20 ms. A gigabit link with irregular delivery sounds worse than a 10 Mb link with steady timing. QoS priority queuing fixes choppy; bandwidth fixes slow. Different diseases."},
{t:"ccna",k:"Longest match beats trust",v:"Routers compare prefix length BEFORE administrative distance. An OSPF /16 beats a static /0 for traffic the /16 covers. This is also how a rogue more-specific route hijacks traffic past all your careful AD design."},
{t:"secplus",k:"RPO drives backup frequency, RTO drives architecture",v:"RPO = how much data you can lose (time since last backup). RTO = how fast you must be running again. Nightly backups give a 24-hour RPO; if the business can only lose an hour, the schedule — not the tooling — is the gap."},
{t:"ccnp",k:"iBGP has split horizon too",v:"Routes learned from one iBGP peer are never re-advertised to another iBGP peer — that's the loop prevention. It's also why iBGP demands a full mesh, and why route reflectors (which may re-advertise, with safeguards) exist."},
{t:"paloalto",k:"Commit is the only 'apply' button",v:"Every PAN-OS edit lands in the candidate config; traffic obeys only the running config. No behavior change after your edits? You didn't commit. Bonus: commit validation names shadowed rules before they bite."},
{t:"netplus",k:"100 meters is a wall",v:"Copper Ethernet is spec'd to 100 m INCLUDING patch cables at both ends. Runs beyond it don't fail politely — they flap, downshift, and throw CRC errors that look like config problems. Past 100 m (or near EMI), fiber isn't fancy — it's correct."},
{t:"ccna",k:"PortFast without BPDU Guard is a dare",v:"PortFast skips STP's 30-second wait so PCs link instantly — but a user plugging in a rogue switch can now loop the floor. BPDU Guard err-disables the port the instant a switch announces itself. They ship as a pair for a reason."},
{t:"secplus",k:"The IDS/IPS difference is one preposition",v:"An IDS watches a COPY of traffic and alerts — zero risk, zero prevention. An IPS sits IN the path and drops — real prevention, and real risk that a false positive blocks the business. Same signatures, opposite failure modes."},
{t:"ccnp",k:"Summaries absorb flaps",v:"A summary route stays advertised as long as ANY component is up — internal churn becomes invisible outside the boundary. Summarization is as much about containing instability as shrinking tables."},
{t:"paloalto",k:"App-ID reads TLS like a luggage tag",v:"Without decryption, App-ID still sees the SNI and certificate in the handshake — enough to name many apps precisely. Content inside the session stays invisible until you decrypt. Identification ≠ inspection."},
{t:"netplus",k:"DNS failure impersonates outages",v:"'The internet is down' but ping 8.8.8.8 works? That's DNS. nslookup against the default resolver, then against 8.8.8.8, tells you in ten seconds whose resolver is lying."},
{t:"ccna",k:"DTP auto + auto = access",v:"'dynamic auto' responds to trunk negotiation but never initiates. Two auto ports politely wait forever and fall back to access mode. At least one side must be desirable or hard-set trunk — a favorite lab and interview trap."},
{t:"secplus",k:"Zero-day means zero days of patch",v:"The vendor has had zero days to fix it — there is nothing to install. Defense shifts entirely to compensating controls: segmentation, least privilege, EDR behavior detection. Patch-based security has a blind spot exactly here."},
{t:"ccnp",k:"Stub routers end query storms",v:"When EIGRP loses a route with no feasible successor, it queries neighbors — and unanswered queries (huge hub-and-spoke domains) cause stuck-in-active resets. Declaring branches 'eigrp stub' stops queries at the edge. SIA is a design smell, not bad luck."},
{t:"paloalto",k:"Panorama splits policy from plumbing",v:"Device groups push POLICY and objects; templates push NETWORK and device settings. Pre-rules enforce org-wide musts above local admin rules; post-rules catch-and-log below them. Two pipelines, one push."},
{t:"netplus",k:"Full mesh math",v:"Full mesh links = n(n−1)/2. Ten sites = 45 links; twenty = 190. This single formula explains why hub-and-spoke, MPLS, and route reflectors all exist: full meshes don't scale, in cabling or in BGP."},
{t:"ccna",k:"DHCP is four broadcasts and a promise",v:"Discover, Offer, Request, Ack — and the two client messages are broadcasts, which die at routers. Every remote-subnet DHCP failure traces to the same line: a missing 'ip helper-address' on the gateway interface."},
{t:"secplus",k:"Hashing is one-way on purpose",v:"Encryption must reverse; hashing must NOT. A site that can email you your old password stored it encrypted (or worse) — a red flag. Proper sites store salted slow hashes and can only verify, never recover."},
{t:"ccnp",k:"eBGP assumes you're touching",v:"eBGP packets ship with TTL 1 — direct connection assumed. Peering between loopbacks needs 'ebgp-multihop' (plus routes to those loopbacks). A session flapping between Idle and Active with reachable peers? Check TTL first."},
{t:"paloalto",k:"Application Override is a bypass, not a shortcut",v:"It forces a name by port/IP and skips App-ID — and with it most threat inspection. The matched traffic is effectively L4-firewalled. Reserve it for trusted internal protocols that misidentify, never for convenience."},
];

let stats, qstats, S={screen:"home"};

let profiles=[], currentPid=null, lg={mode:"list",pinFor:null,err:"",nm:"",pin:"",rem:false};
const AVCOLORS=["#FFB347","#3FD6C6","#5B9DFF","#B08CFF","#7BD88F","#F4634E"];
function hpin(s){let x=5381;for(const c of s)x=((x<<5)+x+c.charCodeAt(0))>>>0;return x.toString(36);}
function loadProfiles(){
  try{profiles=JSON.parse(store.get("cc-profiles")||"[]");}catch(e){profiles=[];}
  currentPid=store.get("cc-current")||null;
  if(currentPid&&!profiles.find(p=>p.id===currentPid))currentPid=null;
}
function saveProfiles(){store.set("cc-profiles",JSON.stringify(profiles));}
function setRemember(on){store.set("cc-current",(on&&currentPid)?currentPid:"");}
function pkey(k){return "cc:"+currentPid+":"+k;}
function initials(n){return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();}
function defStats(){return{xp:0,bestStreak:0,blitzBest:0,perTrack:Object.fromEntries(Object.keys(TRACKS).map(k=>[k,{seen:0,correct:0}])),exams:{},daily:{last:null,streak:0,best:0},scen:{},expl:{},diag:{},cmd:{},kotd:{date:null},gate:{},labs:{},time:{date:null,ms:0,goal:90},days:{}};}
function load(){
  try{stats={...defStats(),...JSON.parse(store.get(pkey("stats"))||"{}")};}catch(e){stats=defStats();}
  try{qstats=JSON.parse(store.get(pkey("qstats"))||"{}");}catch(e){qstats={};}
  if(!stats.days)stats.days={};
  if(!stats.exams)stats.exams={};
  if(!stats.daily)stats.daily={last:null,streak:0,best:0};
  if(!stats.scen)stats.scen={};
  if(!stats.expl)stats.expl={};
  if(!stats.diag)stats.diag={};
  if(!stats.cmd)stats.cmd={};
  if(!stats.kotd)stats.kotd={date:null};
  if(!stats.gate)stats.gate={};
  if(!stats.labs)stats.labs={};
  if(!stats.time)stats.time={date:null,ms:0,goal:90};
  Object.keys(TRACKS).forEach(k=>{if(!stats.perTrack[k])stats.perTrack[k]={seen:0,correct:0};});
}

/* ---- Study time tracking: activity heartbeats, 30-min sessions ---- */
let lastActive=Date.now(), sessionStart=Date.now();
function touchTime(){
  const now=Date.now(), today=dstr(new Date());
  if(stats.time.date!==today){stats.time.date=today;stats.time.ms=0;}
  const d=now-lastActive;
  if(d>300000){sessionStart=now;}            /* >5 min idle = new session */
  else if(d>0&&d<180000){stats.time.ms+=d;}  /* count active gaps under 3 min */
  lastActive=now;
  stats.days=stats.days||{};
  const dd=stats.days[today]=stats.days[today]||{m:0,a:0};
  dd.m=Math.max(dd.m,Math.floor(stats.time.ms/60000));
}
function bumpA(){const t=dstr(new Date());stats.days=stats.days||{};const dd=stats.days[t]=stats.days[t]||{m:0,a:0};dd.a++;}
function todayMins(){const t=dstr(new Date());return stats.time.date===t?Math.floor(stats.time.ms/60000):0;}
function sessionMins(){return Math.floor((Date.now()-sessionStart)/60000);}
window.setGoal=function(m){touchTime();stats.time.goal=m;save();render();};

/* ---- Level progression gates ---- */
function trackLevels(track){const s=new Set();Q.filter(q=>q.t===track).forEach(q=>s.add(lvOf(q)));return[...s].sort();}
function masteryPct(track,l){
  const qs=Q.filter(q=>q.t===track&&lvOf(q)===l);
  const m=qs.filter(q=>{const s=qstats[qid(q)];return s&&s.streak>=2;}).length;
  return qs.length?Math.round(m/qs.length*100):0;
}
function explNailed(track){return EXPLAIN.filter(e=>e.t===track&&stats.expl[e.id]).length;}
function writtenOK(track,l){return !!(stats.gate[track]&&stats.gate[track][l]&&stats.gate[track][l].written);}
function levelPassed(track,l){
  const lvs=trackLevels(track), p=lvs.indexOf(l)+1;
  return masteryPct(track,l)>=80 && writtenOK(track,l) && explNailed(track)>=Math.min(p,EXPLAIN.filter(e=>e.t===track).length);
}
function levelUnlocked(track,l){
  const lvs=trackLevels(track), i=lvs.indexOf(l);
  if(i<=0)return true;
  const d=stats.diag[track];
  if(d&&(d.ready||l<=d.lv))return true;
  return levelPassed(track,lvs[i-1]);
}
function save(){
  if(!currentPid)return;
  stats.updatedAt=Date.now();
  store.set(pkey("stats"),JSON.stringify(stats));
  store.set(pkey("qstats"),JSON.stringify(qstats));
  queueSync();
}
function qid(q){return q.t+":"+q.q.slice(0,40);}
function dstr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function touchStreak(){
  touchTime();
  const t=dstr(new Date());
  const d=stats.daily;
  if(d.last===t)return;
  const y=dstr(new Date(Date.now()-864e5));
  d.streak=(d.last===y)?d.streak+1:1;
  d.last=t; d.best=Math.max(d.best,d.streak);
}
function liveStreak(){
  const d=stats.daily; if(!d.last)return 0;
  const t=dstr(new Date()), y=dstr(new Date(Date.now()-864e5));
  return (d.last===t||d.last===y)?d.streak:0;
}
function recordAnswer(q,correct){
  const id=qid(q), s=qstats[id]||{seen:0,miss:0,streak:0};
  s.seen++; if(correct){s.streak++;}else{s.miss++;s.streak=0;}
  qstats[id]=s;
  stats.perTrack[q.t].seen++; if(correct)stats.perTrack[q.t].correct++;
  touchStreak();bumpA();
  save();
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function layerOf(xp){return Math.min(7,Math.floor(xp/XP_LAYER)+1);}

/* Smart review deck: prioritize missed and unseen questions */
function smartDeck(n){
  const scored=Q.map(q=>{
    const s=qstats[qid(q)]||{seen:0,miss:0,streak:0};
    let w = s.miss*3 + (s.seen===0?2:0) - Math.min(s.streak,3) + Math.random();
    return {q,w};
  });
  scored.sort((a,b)=>b.w-a.w);
  return scored.slice(0,n).map(o=>o.q);
}

function osiLadder(){
  const xp=stats.xp, maxed=xp>=7*XP_LAYER, layer=layerOf(xp), within=xp%XP_LAYER;
  let rows="";
  for(let i=6;i>=0;i--){
    const n=i+1, done=maxed||n<layer, active=!maxed&&n===layer;
    const pct=active?(within/XP_LAYER*100):(done?100:0);
    rows+=`<div class="osi-row" style="border-color:${done||active?'var(--amber)':'var(--line)'}">
      <div class="osi-fill" style="width:${pct}%"></div>
      <div class="osi-lbl"><span style="color:${done||active?'var(--text)':'var(--dim)'}">L${n} ${OSI[i]}</span>
      ${done?'<span style="color:var(--amber)">✓</span>':active?`<span style="color:var(--amber)">${within}/${XP_LAYER}</span>`:''}</div>
    </div>`;
  }
  return `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
    <span class="eyebrow" style="color:var(--amber)">Rank · Layer ${maxed?7:layer}</span>
    <span class="stat" style="color:var(--dim)">${xp} XP</span></div>
    <div style="display:grid;gap:3px">${rows}</div>`;
}

/* ---------------- DIAGNOSTIC (placement pre-test) ---------------- */
let dg={};
function diagDeck(track){
  const tracks=track?[track]:Object.keys(TRACKS);
  let deck=[];
  tracks.forEach(k=>{
    const pool=Q.filter(q=>q.t===k);
    const by={1:[],2:[],3:[],4:[]};pool.forEach(q=>by[lvOf(q)].push(q));
    const lvs=[1,2,3,4].filter(l=>by[l].length);
    if(track){
      lvs.forEach(l=>deck.push(...shuffle(by[l]).slice(0,3)));
    }else{
      const per=5, sh={},idx={};lvs.forEach(l=>{sh[l]=shuffle(by[l]);idx[l]=0;});
      const picks=[];let i=0;
      while(picks.length<per&&i<200){
        const l=lvs[i%lvs.length];
        if(idx[l]<sh[l].length)picks.push(sh[l][idx[l]++]);
        i++;
      }
      deck.push(...picks);
    }
  });
  return shuffle(deck);
}
function startDiag(track){dg={track:track||null,deck:diagDeck(track),i:0,answers:[]};}
function renderDiag(){
  const q=dg.deck[dg.i], t=TRACKS[q.t];
  let opts="";
  q.a.forEach((opt,idx)=>{opts+=`<button class="opt" onclick="diagPick(${idx})"><span class="mk">${String.fromCharCode(65+idx)}</span>${esc(opt)}</button>`;});
  app.innerHTML=header()+`<div style="max-width:720px;margin:0 auto">
    <div class="qbar"><span class="eyebrow" style="color:var(--amber)">Test Your Knowledge · ${dg.track?TRACKS[dg.track].name:"All certs"} · ${dg.i+1}/${dg.deck.length}</span>
    <span style="color:${t.hex};font-size:11px">${t.short}</span>
    <span style="color:var(--dim)">no feedback until the map</span></div>
    <div class="tbar"><div style="width:${(dg.i/dg.deck.length)*100}%"></div></div>
    <div class="panel"><div style="font-size:17px;line-height:1.5">${esc(q.q)}</div>
    <div class="grid" style="margin-top:18px">${opts}</div></div>
    <div class="nav" style="margin-top:14px"><button class="btn ghost" style="border-color:var(--dim);color:var(--dim)" onclick="go({screen:'home'})">Abandon</button></div></div>`;
}
window.diagPick=function(idx){
  touchTime();save();
  dg.answers.push(idx);
  dg.i++;
  if(dg.i>=dg.deck.length)finishDiag();else renderDiag();
};
function finishDiag(){
  const R={};
  dg.deck.forEach((q,i)=>{
    const ok=dg.answers[i]===q.c;
    const k=q.t;R[k]=R[k]||{byLv:{},byDom:{},misses:[],c:0,n:0};
    const l=lvOf(q);R[k].byLv[l]=R[k].byLv[l]||{c:0,n:0};R[k].byLv[l].n++;if(ok)R[k].byLv[l].c++;
    R[k].byDom[q.d]=R[k].byDom[q.d]||{c:0,n:0};R[k].byDom[q.d].n++;if(ok)R[k].byDom[q.d].c++;
    R[k].n++;if(ok)R[k].c++;else R[k].misses.push(q);
    recordAnswer(q,ok);
  });
  for(const k of Object.keys(R)){
    const lvs=[1,2,3,4].filter(l=>R[k].byLv[l]);
    let place=null,ready=false;
    for(const l of lvs){const v=R[k].byLv[l];if(v.c/v.n<0.7){place=l;break;}}
    if(place===null){place=lvs[lvs.length-1];ready=true;}
    R[k].place=place;R[k].ready=ready;
    stats.diag[k]={lv:place,ready,date:Date.now()};
  }
  save();
  dg.report=R;
  go({screen:"diagReport"});
}

  gt.report={score,pass,misses,first};
  renderGate();
};

/* Turn a matcher into the command a human should type.
   Optional groups expand to their full form: sh(ow)? ip ospf nei(ghbor)? -> show ip ospf neighbor */
function ansOf(o){
  if(o.ans)return o.ans;
  if(!o.ac||!o.ac.length)return o.k||"";   /* sandbox entries carry a canonical .k instead */
  return String(o.ac[0].source)
    .replace(/^\^|\$$/g,"")
    .replace(/\(\s*\\S\+\s*\)\?/g," ")   /* optional free-form argument */
    .replace(/\\S\+/g,"")
    .replace(/\.\*/g,"")
    .replace(/\\(.)/g,"$1")                /* unescape literals: \/ \. -> / . */
    .replace(/[()?]/g,"")                 /* keep group CONTENTS, drop the syntax */
    .replace(/\s+/g," ")
    .trim();
}

/* ---------------- TERMINAL BEHAVIOUR: history + tab completion ---------------- */
/* Works the way a real shell does: ↑/↓ walks what you typed, Tab completes. */
const term={cmd:{hist:[],idx:-1},lab:{hist:[],idx:-1},sb:{hist:[],idx:-1}};
function termVocab(mode){
  const v=new Set();
  if(mode==="cmd"&&cl.deck){cl.deck.forEach(c=>v.add(ansOf(c)));}
  if(mode==="lab"&&lb.lab){lb.lab.steps.forEach(s=>v.add(ansOf(s)));}
  if(mode==="sb"&&SB[sb.v]){SB[sb.v].cmds.forEach(c=>v.add(c.k));["?","help ","clear","exit"].forEach(x=>v.add(x));}
  term[mode].hist.forEach(h=>v.add(h));
  return [...v];
}
function commonPrefix(list){
  if(!list.length)return "";
  let p=list[0];
  for(const s of list){let i=0;while(i<p.length&&i<s.length&&p[i].toLowerCase()===s[i].toLowerCase())i++;p=p.slice(0,i);}
  return p;
}
window.termKey=function(e,mode){
  const inp=document.getElementById(mode==="cmd"?"cmd-in":mode==="sb"?"sb-in":"lab-in");
  if(!inp)return;
  const st=term[mode];
  if(e.key==="Enter"){ st.idx=-1; (mode==="cmd"?window.cmdRun:mode==="sb"?window.sbRun:window.labRun)(); return; }
  if(e.key==="ArrowUp"){
    e.preventDefault&&e.preventDefault();
    if(!st.hist.length)return;
    st.idx = st.idx<0 ? st.hist.length-1 : Math.max(0,st.idx-1);
    inp.value=st.hist[st.idx]; return;
  }
  if(e.key==="ArrowDown"){
    e.preventDefault&&e.preventDefault();
    if(st.idx<0)return;
    st.idx++;
    if(st.idx>=st.hist.length){st.idx=-1;inp.value="";}else inp.value=st.hist[st.idx];
    return;
  }
  if(e.key==="Tab"){
    e.preventDefault&&e.preventDefault();
    const cur=(inp.value||"").replace(/^\s+/,"");
    const hint=document.getElementById(mode+"-hint");
    if(!cur){if(hint)hint.textContent="";return;}
    const matches=termVocab(mode).filter(v=>v.toLowerCase().startsWith(cur.toLowerCase()));
    if(!matches.length){if(hint)hint.textContent="";return;}
    if(matches.length===1){inp.value=matches[0];if(hint)hint.textContent="";return;}
    const p=commonPrefix(matches);
    if(p.length>cur.length)inp.value=p;
    if(hint)hint.textContent=matches.slice(0,4).join("    ")+(matches.length>4?"    …":"");
    return;
  }
};

function startExam(track){
  clearInterval(exTimer);
  const t=TRACKS[track];
  const all=Q.filter(q=>q.t===track);
  const by={1:[],2:[],3:[],4:[]}; all.forEach(q=>by[lvOf(q)].push(q));
  const w={1:.2,2:.35,3:.3,4:.15};
  let pool=[];
  for(const l of [1,2,3,4]) pool.push(...shuffle(by[l]).slice(0,Math.round(t.examQ*w[l])));
  if(pool.length<t.examQ){
    const rest=shuffle(all.filter(q=>!pool.includes(q)));
    pool.push(...rest.slice(0,t.examQ-pool.length));
  }
  pool=shuffle(pool).slice(0,t.examQ);
  ex={track,deck:pool,i:0,answers:new Array(pool.length).fill(null),flags:new Set(),time:t.examMin*60,done:false};
  exTimer=setInterval(()=>{
    ex.time--;
    if(ex.time<=0){clearInterval(exTimer);finishExam();return;}
    if(S.screen!=="exam")return;
    const tt=document.getElementById("ex-timer"),bb=document.getElementById("ex-bar");
    if(tt){tt.textContent=fmtTime(ex.time);tt.style.color=ex.time<=120?"var(--red)":"var(--amber)";}
    if(bb){bb.style.width=(ex.time/(TRACKS[ex.track].examMin*60)*100)+"%";if(ex.time<=120)bb.parentElement.classList.add("low");}
  },1000);
}
function fmtTime(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}

function finishExam(){

window.labRun=function(){
  touchTime();
  const inp=document.getElementById("lab-in");
  const raw=(inp&&inp.value||"").trim().replace(/\s+/g," ");
  if(!raw)return;
  term.lab.hist.push(raw);term.lab.idx=-1;
  const st=lb.lab.steps[lb.step];
  if(st.ac.some(rx=>rx.test(raw.toLowerCase()))){
    lb.transcript.push({ps:st.ps,cmd:raw,out:st.out});
    lb.step++;lb.state="ready";lb.tries=0;
    touchStreak();bumpA();
    if(lb.step>=lb.lab.steps.length){
      lb.done=true;
      lb.first=!stats.labs[lb.lab.id];
      if(lb.first){stats.labs[lb.lab.id]=true;stats.xp+=lb.lab.xp;}
    }
    save();
  }else{lb.tries++;lb.state="bad";save();}
  render();
};

/* ============================================================
   CLOUD MODE — talks to the NAS backend when it's reachable.
   Served from the NAS  -> real accounts + cross-device sync.
   Opened anywhere else -> local profiles, exactly as before.
   ============================================================ */
let cloud={on:false,token:null,user:null,state:"idle",err:null,lastSync:0,timer:null};
let ca={mode:"signin",err:"",msg:"",busy:false,resetToken:null};
const API=(p)=>p;   /* same origin: the server serves this file */

async function api(method,path,body,token){
  const r=await fetch(API(path),{method,
    headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},
    body:body?JSON.stringify(body):undefined});
  let d=null;try{d=await r.json();}catch(e){}
  return{ok:r.ok,status:r.status,data:d||{}};
}
async function probeApi(){
  try{
    const c=new AbortController();const t=setTimeout(()=>c.abort(),2500);
    const r=await fetch(API("/api/health"),{signal:c.signal});clearTimeout(t);
    if(!r.ok)return false;
    const d=await r.json();return d&&d.ok===true;
  }catch(e){return false;}
}
function cloudSignedOut(){cloud.token=null;cloud.user=null;store.set("cc-token","");currentPid=null;}

async function cloudEnter(token,user){
  cloud.token=token;cloud.user=user;store.set("cc-token",token);
  currentPid="u"+user.id;
  load();
  lastActive=Date.now();sessionStart=Date.now();
  await syncPull();
  ca={mode:"signin",err:"",msg:"",busy:false,resetToken:null};
  go({screen:"home"});
}

/* pull on sign-in: whichever side is newer wins */
async function syncPull(){
  if(!cloud.token)return;
  cloud.state="syncing";
  try{
    const r=await api("GET","/api/progress",null,cloud.token);
    if(r.ok){
      const srv=r.data, localAt=Number(stats.updatedAt||0), srvAt=Number(srv.updatedAt||0);
      if(srv.stats&&srvAt>localAt){
        stats={...defStats(),...srv.stats};
        if(!stats.days)stats.days={};
        qstats=srv.qstats||{};
        save();
      }else if(localAt>srvAt){
        await syncPush(true);
      }
      cloud.state="ok";cloud.lastSync=Date.now();cloud.err=null;
    }else cloud.state="off";
  }catch(e){cloud.state="off";}
}

async function syncPush(silent){
  if(!cloud.token)return;
  cloud.state="syncing";if(!silent)render();
  try{
    const r=await api("PUT","/api/progress",{stats,qstats,updatedAt:Number(stats.updatedAt||Date.now())},cloud.token);
    if(r.ok){cloud.state="ok";cloud.lastSync=Date.now();cloud.err=null;}
    else if(r.status===409&&r.data.server){
      /* another device saved something newer — take theirs */
      stats={...defStats(),...r.data.server.stats};
      if(!stats.days)stats.days={};
      qstats=r.data.server.qstats||{};
      save();cloud.state="ok";cloud.lastSync=Date.now();
    }
    else if(r.status===401){cloudSignedOut();cloud.state="idle";}
    else cloud.state="off";
  }catch(e){cloud.state="off";}
  if(!silent)render();
}
function queueSync(){
  if(!cloud.on||!cloud.token)return;
  clearTimeout(cloud.timer);
  cloud.timer=setTimeout(()=>syncPush(true),4000);   /* debounce: 4s after the last change */
}

window.caSubmit=async function(){
  const g=id=>((document.getElementById(id)||{}).value||"").trim();
  /* capture values first — render() rebuilds the DOM and clears the fields */
  const V={f:g("cf"),l:g("cl"),e:g("ce"),p:g("cp")};
  ca.fn=V.f;ca.ln=V.l;ca.em=V.e;
  ca.err="";ca.msg="";ca.busy=true;render();
  try{
    if(ca.mode==="signup"){
      const r=await api("POST","/api/signup",{first:V.f,last:V.l,email:V.e,password:V.p});
      ca.busy=false;
      if(!r.ok){ca.err=r.data.error||"Could not create the account.";if(r.data.exists)ca.mode="signin";render();return;}
      await cloudEnter(r.data.token,r.data.user);return;
    }
    if(ca.mode==="forgot"){
      await api("POST","/api/forgot",{email:V.e});
      ca.busy=false;ca.mode="signin";
      ca.msg="If that email has an account, a reset link is on its way. Check your inbox.";render();return;
    }
    if(ca.mode==="reset"){
      const r=await api("POST","/api/reset",{token:ca.resetToken,password:V.p});
      ca.busy=false;
      if(!r.ok){ca.err=r.data.error||"Could not reset the password.";render();return;}
      history.replaceState({},"",location.pathname);
      await cloudEnter(r.data.token,r.data.user);return;
    }
    const r=await api("POST","/api/login",{email:V.e,password:V.p});
    ca.busy=false;
    if(!r.ok){ca.err=r.data.error||"Could not sign in.";render();return;}
    await cloudEnter(r.data.token,r.data.user);
  }catch(e){ca.busy=false;ca.err="Can't reach the server. Check that it's running.";render();}
};

async function bootCloud(){

window.codeDone=function(){const id=lg.codeFor;lg={mode:"list",pinFor:null,err:"",nm:"",pin:"",rem:lg.rem};enterProfile(id);};
window.recVerify=function(){
  const p=profiles.find(x=>x.id===lg.recFor);
  const v=(document.getElementById("rc-in")||{}).value||"";
  const useQ=(lg.recMethod==="question"&&p.q!=null)||!p.rc;
  const ok=useQ?(p.qa&&hpin(norm(v))===p.qa):(p.rc&&hpin(norm(v).toUpperCase().replace(/\s/g,""))===p.rc);
  if(ok){lg.recStep="newpin";lg.err="";}
  else lg.err=useQ?"That answer doesn't match.":"That code doesn't match. Check the email you sent yourself.";
  render();
};
window.recSetPin=function(){

};
window.loginSelect=function(id){
  const p=profiles.find(x=>x.id===id);if(!p)return;

  enterProfile(id);
};
window.loginPin=function(id){
  const p=profiles.find(x=>x.id===id);
  const v=(document.getElementById("pin-in")||{}).value||"";
  if(hpin(v)===p.pin)enterProfile(id);
  else{lg.err="wrong";render();}
};
window.loginCreate=function(){
  const g=id=>((document.getElementById(id)||{}).value||"").trim();
  const fn=g("fn-in"), ln=g("ln-in"), em=g("em-in"), pin=g("npin-in"), qi=g("q-in"), qa=g("qa-in");
  lg.fn=fn;lg.ln=ln;lg.em=em;lg.dupId=null;lg.errField=null;
  const fail=(msg,field,dup)=>{lg.err=msg;lg.errField=field||null;lg.dupId=dup||null;render();};
  if(fn.length<2)return fail("Enter your first name.");
  if(ln.length<1)return fail("Enter your last name.");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return fail("That doesn't look like a valid email address.","em");
  const dupE=profiles.find(p=>norm(p.email||"")===norm(em));
  if(dupE)return fail("An account with that email already exists on this device.","em",dupE.id);
  const full=fn+" "+ln;
  const dupN=profiles.find(p=>norm(p.name)===norm(full));
  if(dupN)return fail("An account for "+dupN.name+" already exists on this device.",null,dupN.id);
  if(qi!==""&&!qa)return fail("Add an answer to your security question (or clear the question).");
  const id="p"+Date.now().toString(36);
  const p={id,name:full,first:fn,last:ln,email:em,color:AVCOLORS[profiles.length%AVCOLORS.length],
    pin:pin?hpin(pin):null,created:Date.now(),verified:false};
  if(qi!==""){p.q=parseInt(qi,10);p.qa=hpin(norm(qa));}
  const code=pin?genCode():null;
  if(code)p.rc=hpin(code);
  const firstEver=profiles.length===0;
  profiles.push(p);
  const vcode=String(Math.floor(100000+Math.random()*900000));
  p.vc=hpin(vcode);
  currentPid=id;saveProfiles();setRemember(lg.rem);
  if(firstEver&&store.get("cc-stats")){
    store.set(pkey("stats"),store.get("cc-stats"));
    if(store.get("cc-qstats"))store.set(pkey("qstats"),store.get("cc-qstats"));
  }
  load();lastActive=Date.now();sessionStart=Date.now();
  lg={mode:"verify",vFor:id,vCode:vcode,newCode:code,err:"",sent:false,rem:lg.rem};
  render();
};
window.lgGoSignIn=function(id){lg={mode:"list",pinFor:id,err:"",nm:"",pin:"",rem:lg.rem};render();};
window.vSend=function(){lg.sent=true;render();};
window.vCheck=function(){
  const p=profiles.find(x=>x.id===lg.vFor);

  if(hpin(v)===p.vc){p.verified=true;delete p.vc;saveProfiles();vDone();}

};

function vDone(){

function enterProfile(id){currentPid=id;setRemember(lg.rem);load();lg={mode:"list",pinFor:null,err:"",nm:"",pin:"",rem:false};lastActive=Date.now();sessionStart=Date.now();go({screen:"home"});}

function calHtml(){
  const now=new Date();
  const view=new Date(now.getFullYear(),now.getMonth()+stM,1);
  const yr=view.getFullYear(),mo=view.getMonth();
  const monthName=view.toLocaleString('default',{month:'long'});
  const firstDow=new Date(yr,mo,1).getDay();
  const daysIn=new Date(yr,mo+1,0).getDate();
  const today=dstr(now);
  let cells="";
  "SMTWTFS".split("").forEach(d=>{cells+=`<div style="font-family:var(--mono);font-size:9.5px;color:var(--dim);text-align:center">${d}</div>`;});
  for(let i=0;i<firstDow;i++)cells+="<div></div>";
  for(let d=1;d<=daysIn;d++){
    const key=yr+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const rec=stats.days[key];
    const m=rec?rec.m:0, a=rec?rec.a:0;
    let bg="var(--panel2)",bd="var(--line)";
    if(m>=stats.time.goal){bg="rgba(63,214,198,.55)";bd="var(--cyan)";}
    else if(m>=30){bg="rgba(255,179,71,.5)";bd="var(--amber)";}
    else if(m>=10){bg="rgba(255,179,71,.25)";bd="rgba(255,179,71,.4)";}
    else if(m>0||a>0){bg="rgba(255,179,71,.12)";bd="var(--line)";}
    const isToday=key===today;
    cells+=`<div title="${key}: ${m}m · ${a} answered" style="aspect-ratio:1;border-radius:7px;background:${bg};border:1px solid ${isToday?'var(--text)':bd};display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:${m>=30?'#0B1220':'var(--dim)'}">${d}</div>`;
  }
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <button class="btn ghost" style="border-color:var(--line);color:var(--dim);padding:5px 12px;font-size:12px" onclick="calNav(-1)">‹</button>
    <span style="font-weight:700;font-size:14px">${monthName} ${yr}</span>
    <button class="btn ghost" style="border-color:var(--line);color:var(--dim);padding:5px 12px;font-size:12px" ${stM>=0?'disabled':''} onclick="calNav(1)">›</button></div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${cells}</div>
    <div style="display:flex;gap:12px;margin-top:12px;font-family:var(--mono);font-size:9.5px;color:var(--dim);flex-wrap:wrap">
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(255,179,71,.25);vertical-align:middle"></span> studied</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(255,179,71,.5);vertical-align:middle"></span> 30m+ session</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(63,214,198,.55);vertical-align:middle"></span> goal met</span></div>`;
}

let sb={v:"cisco",mode:"oper",trans:[],last:null,sugg:null,filter:"all"};
window.sbVendor=function(v){sb={v,mode:"oper",trans:[],last:null,sugg:null,filter:"all"};term.sb={hist:[],idx:-1};render();};
window.sbFilter=function(f){sb.filter=f;render();};
window.sbClear=function(){sb.trans=[];sb.last=null;sb.sugg=null;render();};
window.sbTry=function(c){const inp=document.getElementById("sb-in");if(inp){inp.value=c;window.sbRun();}else{term.sb.hist.push(c);sbExec(c);render();}};
function sbDev(){return SB[sb.v];}
function sbExec(raw){
  const cmd=raw.trim().replace(/\s+/g," ");
  if(!cmd)return;
  const d=sbDev();
  sb.sugg=null;
  if(cmd==="?"||cmd==="help"){
    sb.trans.push({c:cmd,o:"Available commands are listed on the right — tap one to run it.\nTry: help <command>  ·  clear  ·  exit"});
    return;
  }
  if(cmd==="clear"){sb.trans=[];sb.last=null;return;}
  if(cmd==="exit"||cmd==="end"||cmd==="quit"){
    if(sb.mode==="conf"){sb.mode="oper";sb.trans.push({c:cmd,o:"(back to operational mode)"});}
    else sb.trans.push({c:cmd,o:"(already at the top level)"});
    return;
  }
  if(cmd.startsWith("help ")){
    const q=cmd.slice(5).trim().toLowerCase();
    const hit=d.cmds.find(x=>x.k.toLowerCase().startsWith(q)||x.m.some(r=>r.test(q)));
    if(hit){sb.last=hit;sb.trans.push({c:cmd,o:"→ knowledge panel updated for: "+hit.k});}
    else sb.trans.push({c:cmd,o:"No help entry for that. Type ? to list what this device knows."});
    return;
  }
  const hit=d.cmds.find(x=>x.m.some(r=>r.test(cmd.toLowerCase())));
  if(hit){
    if(hit.mode==="conf"&&sb.mode!=="conf"){
      sb.trans.push({c:cmd,o:"% This command only exists in configuration mode. Enter it first."});
      sb.last=d.cmds.find(x=>x.to==="conf")||null;
      return;
    }
    sb.trans.push({c:cmd,o:hit.out});
    sb.last=hit;
    if(hit.to)sb.mode=hit.to;
    touchTime();bumpA();save();
    return;
  }
  /* unknown — be useful about it */
  const first=cmd.split(" ")[0].toLowerCase();
  const near=d.cmds.filter(x=>x.k.toLowerCase().startsWith(first)||x.k.toLowerCase().includes(first)).slice(0,4);
  sb.trans.push({c:cmd,o:"% Unrecognised command on this platform."});
  sb.sugg=near.length?near:null;
}
window.sbRun=function(){
  const inp=document.getElementById("sb-in");
  const raw=(inp&&inp.value||"");
  if(!raw.trim())return;
  term.sb.hist.push(raw.trim());term.sb.idx=-1;
  sbExec(raw);
  render();
};

          <button class="btn" style="background:${d.hex};border-color:${d.hex};font-size:11px;padding:9px 16px" onclick="sbRun()">Run ⏎</button>
          <button class="btn ghost" style="border-color:var(--dim);color:var(--dim);font-size:11px;padding:9px 14px" onclick="sbClear()">Clear</button>
          <button class="btn ghost" style="border-color:var(--green);color:var(--green);font-size:11px;padding:9px 14px" onclick="go({screen:'learn'})">⌘ Reference</button>
          <button class="btn ghost" style="border-color:var(--amber);color:var(--amber);font-size:11px;padding:9px 14px" onclick="tfVendor(sb.v);go({screen:'tasks'})">⌕ Task finder</button>
        </div>
        ${know}
      </div>
      <div>
        <div class="eyebrow" style="margin-bottom:8px">Commands by purpose</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">${filters}</div>
        <div style="display:grid;gap:7px">${list}</div>
      </div>
    </div>
    <div class="nav" style="margin-top:20px"><button class="btn ghost" style="border-color:var(--dim);color:var(--dim)" onclick="go({screen:'home'})">Home</button></div></div>
  <style>@media(max-width:860px){.sb-grid{grid-template-columns:1fr !important}}@media(max-width:520px){.kn-2col{grid-template-columns:1fr !important}}</style>`;
  const inp=document.getElementById("sb-in");if(inp&&inp.focus)try{inp.focus();}catch(e){}
}

/* ---------------- TASK FINDER ---------------- */
let tf={v:"cisco",q:"",c:"all"};
window.tfVendor=function(v){tf.v=v;render();};
window.tfCat=function(c){tf.c=c;render();};
window.tfSearch=function(){const i=document.getElementById("tf-q");tf.q=i?i.value:"";render();};
function renderTasks(){
  const meta=LEARN.find(x=>x.id===tf.v)||LEARN[0];
  const all=TASKS[tf.v]||[];
  const q=tf.q.trim().toLowerCase();
  const rows=all.filter(r=>(tf.c==="all"||r.c===tf.c)&&(!q||(r.w+" "+r.u+" "+r.n).toLowerCase().includes(q)));
  const pills=Object.keys(TASKS).map(k=>{const L=LEARN.find(x=>x.id===k)||{name:k,hex:"#8C97AC"};
    return `<button class="btn ghost" style="border-color:${k===tf.v?L.hex:'var(--line)'};color:${k===tf.v?L.hex:'var(--dim)'};font-size:10.5px;padding:8px 13px" onclick="tfVendor('${k}')">${esc(L.name)}</button>`;}).join("");
  const cats=["all","verify","trouble","config","setup","save"].filter(c=>c==="all"||all.some(r=>r.c===c));
  const filters=cats.map(c=>`<button class="btn ghost" style="border-color:${tf.c===c?(c==="all"?meta.hex:CAT[c].c):'var(--line)'};color:${tf.c===c?(c==="all"?meta.hex:CAT[c].c):'var(--dim)'};font-size:9.5px;padding:6px 11px" onclick="tfCat('${c}')">${c==="all"?"All":esc(CAT[c].n)}</button>`).join("");

  const body=rows.map(r=>`<div class="panel" style="padding:0;overflow:hidden;border-left:3px solid ${CAT[r.c].c}">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0" class="tf-row">
      <div style="padding:13px 15px">
        <div class="eyebrow" style="margin-bottom:5px">If you want to…</div>
        <div style="font-size:14px;line-height:1.5;font-weight:600">${esc(r.w)}</div></div>
      <div style="padding:13px 15px;background:var(--panel2)">
        <div class="eyebrow" style="margin-bottom:5px;color:${CAT[r.c].c}">Use…</div>
        <div style="font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--text)">${esc(r.u)}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)" class="tf-row">
      <div style="padding:10px 15px">
        <div class="eyebrow" style="margin-bottom:4px">Where can I use this?</div>
        <div style="font-size:12px;color:var(--dim);line-height:1.5">${esc(r.m)}</div></div>
      <div style="padding:10px 15px;background:rgba(148,175,215,.04)">
        <div class="eyebrow" style="margin-bottom:4px">What do I need?</div>
        <div style="font-size:12px;color:var(--dim);line-height:1.5">${esc(r.n)}</div></div>
    </div></div>`).join("");

  app.innerHTML=header()+`<div style="max-width:940px;margin:0 auto">
    <span class="eyebrow" style="color:var(--amber)">Task Finder</span>
    <h2 class="screen-title" style="margin:4px 0 6px">Start from the job, not the command</h2>
    <p style="font-size:13px;color:var(--dim)">Search what you're trying to do and get the command, where it runs, and what it needs.</p>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 10px">${pills}</div>
    <input id="tf-q" value="${esc(tf.q)}" placeholder="Search — e.g. 'routing table', 'save', 'bgp', 'ping'" oninput="tfSearch()"
      style="width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--text);font-size:14.5px;padding:13px 15px;outline:none;font-family:var(--sans)">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 14px">${filters}</div>
    <div style="font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:10px">${rows.length} of ${all.length} tasks</div>
    <div class="grid">${body||'<div class="panel" style="color:var(--dim);font-size:14px">Nothing matches that. Try a shorter word — or check the Command Reference for the platform\'s way of naming things.</div>'}</div>
    <div class="nav" style="margin-top:20px">
      <button class="btn ghost" style="border-color:var(--dim);color:var(--dim)" onclick="go({screen:'home'})">Home</button>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" style="border-color:var(--green);color:var(--green);font-size:11px;padding:9px 14px" onclick="go({screen:'learn'})">⌘ Reference</button>
        <button class="btn" style="background:var(--cyan);border-color:var(--cyan);font-size:11px;padding:9px 14px" onclick="sbVendor('${tf.v}');go({screen:'sandbox'})">▶ Try in sandbox</button>
      </div></div></div>
  <style>@media(max-width:640px){.tf-row{grid-template-columns:1fr !important}}</style>`;
  const i=document.getElementById("tf-q");
  if(i&&i.focus){try{i.focus();if(i.setSelectionRange)i.setSelectionRange(i.value.length,i.value.length);}catch(e){}}
}

/* ---------------- GROUPED NAVIGATION ---------------- */
const NAV=[
 {id:"dash",label:"Dashboard",sym:"▦",bg:"rgba(255,179,71,.15)",screen:"home",screens:["home"]},
 {id:"study",label:"Study",sym:"◎",bg:"rgba(63,214,198,.15)",
  screens:["diag","diagReport","smart","quiz","levels","gate","cards","blitz","missed","examIntro","exam","examReport"],
  items:[["Test your knowledge","go({screen:'diag'})"],["Smart Review","go({screen:'smart'})"],
         ["Blitz mode","go({screen:'blitz'})"],["Missed log","go({screen:'missed'})"]]},
 {id:"cmds",label:"Commands",sym:"⌘",bg:"rgba(123,216,143,.15)",screen:"commands",
  screens:["commands","sandbox","tasks","learn","cmdlab","lab"],
  items:[["Sandbox","go({screen:'sandbox'})"],["Task finder","go({screen:'tasks'})"],
         ["Reference","go({screen:'learn'})"],["Command Lab","go({screen:'commands'})"],
         ["Practice Labs","go({screen:'commands'})"]]},
 {id:"learn",label:"Learn",sym:"◫",bg:"rgba(91,157,255,.15)",
  screens:["scenList","scen","explain"],
  items:[["Scenario Lab","go({screen:'scenList'})"],["Explain it back","go({screen:'explain'})"]]},
 {id:"prog",label:"Progress",sym:"▤",bg:"rgba(176,140,255,.15)",screens:["stats"],
  items:[["My stats","go({screen:'stats'})"]]},
];
let navOpen=null;
window.navToggle=function(id){
  const g=NAV.find(x=>x.id===id);
  if(g&&!g.items){go({screen:g.screen});return;}
  navOpen=(navOpen===id?null:id);render();
};
function navSidebar(extra){
  const cur=S.screen||"home";
  const activeGroup=(NAV.find(g=>g.screens.includes(cur))||{}).id;
  if(navOpen===null)navOpen=activeGroup;
  let out="";
  NAV.forEach(g=>{
    const on=g.id===activeGroup, open=navOpen===g.id&&g.items;
    out+=`<button class="navlink${on?' on':''}" onclick="navToggle('${g.id}')">
      <span class="ic" style="background:${g.bg}">${g.sym}</span>${g.label}
      ${g.items?`<span style="margin-left:auto;color:var(--dim);font-size:10px;transition:transform .15s;display:inline-block;transform:rotate(${open?90:0}deg)">›</span>`:''}
    </button>`;
    if(open){
      out+=`<div style="display:grid;gap:1px;margin:1px 0 4px 0;padding-left:37px;border-left:1px solid var(--line);margin-left:13px">
        ${g.items.map(([l,act])=>`<button onclick="${act}" style="text-align:left;background:none;border:none;cursor:pointer;color:var(--dim);font-family:var(--sans);font-size:12.5px;padding:7px 10px;border-radius:8px" onmouseover="this.style.color='var(--text)';this.style.background='var(--panel2)'" onmouseout="this.style.color='var(--dim)';this.style.background='none'">${l}</button>`).join("")}
      </div>`;
    }
  });
  return `<aside class="side"><nav class="panel" style="padding:10px;display:grid;gap:2px">${out}</nav>${extra||""}</aside>`;
}

/* ---------------- COMMANDS HUB ---------------- */
function renderCommands(){
  const cmdSolved=CMDS.filter(c=>stats.cmd[c.id]===true).length;
  const labsDone=LABS.filter(l=>stats.labs[l.id]).length;
  const sec=(sym,color,title,desc,body)=>`<div class="panel" style="border-left:3px solid ${color}">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="chip" style="background:${color}22">${sym}</div>
      <div><h3 style="font-size:15.5px;font-weight:700;color:${color}">${title}</h3>
      <p style="font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:2px">${desc}</p></div></div>
    <div style="margin-top:13px">${body}</div></div>`;

  const devBtns=Object.entries(SB).map(([k,x])=>`<button class="btn ghost" style="border-color:${x.hex};color:${x.hex};font-size:10px;padding:8px 12px" onclick="sbVendor('${k}');go({screen:'sandbox'})">${esc(x.name)}</button>`).join("");
  const labBtns=Object.entries(GRP).map(([k,t])=>`<button class="btn ghost" style="border-color:${t.hex};color:${t.hex};font-size:10px;padding:8px 12px" onclick="go({screen:'cmdlab',track:'${k}'})">${t.short}</button>`).join("");
  const refBtns=LEARN.map(v=>`<button class="btn ghost" style="border-color:${v.hex};color:${v.hex};font-size:10px;padding:8px 12px" onclick="learnVendor('${v.id}');go({screen:'learn'})">${esc(v.name)}</button>`).join("");
  const labList=LABS.map(l=>{const t=TRACKS[l.t];return `<button class="panel" style="text-align:left;cursor:pointer;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-left:3px solid ${t.hex};color:var(--text)" onclick="go({screen:'lab',id:'${l.id}'})">
    <div><span style="font-family:var(--mono);font-size:10px;color:${t.hex}">${t.short}</span>
    <div style="font-size:14px;font-weight:600;margin-top:2px">${esc(l.title)}</div></div>
    <span style="font-family:var(--mono);font-size:13px;color:${stats.labs[l.id]?'var(--cyan)':'var(--dim)'}">${stats.labs[l.id]?'✓':l.steps.length+' steps'}</span></button>`;}).join("");

  app.innerHTML=header()+`<div class="home">${navSidebar()}
    <div style="display:grid;gap:13px">
      <div>
        <span class="eyebrow" style="color:var(--green)">Commands</span>
        <h2 class="screen-title" style="margin:4px 0 4px">Everything CLI in one place</h2>
        <p style="font-size:13px;color:var(--dim)">Explore freely, look up a task, read what a command means, or drill it under pressure.</p>
      </div>
      ${sec("▶","#3FD6C6","Sandbox","Free-play on six simulated devices — every command explains itself",devBtns)}
      ${sec("⌕","#FFB347","Task Finder",'"If you want to… use…" — search 76 tasks by the job you\'re doing',
        `<button class="btn" style="font-size:11px;padding:9px 16px" onclick="go({screen:'tasks'})">Search tasks</button>`)}
      ${sec("⌘","#7BD88F","Reference","Config models, prompts, command anatomy, and a side-by-side translation table",refBtns)}
      ${sec("⌨","#B08CFF","Command Lab",`Timed challenges — type the right command for a real scenario · <span style="color:var(--text)">${cmdSolved}/${CMDS.length} solved</span>`,labBtns)}
      ${sec("⚗","#F4634E","Practice Labs",`Multi-step missions — build a full config command by command · <span style="color:var(--text)">${labsDone}/${LABS.length} complete</span>`,
        `<div class="grid" style="gap:8px">${labList}</div>`)}
      <div class="nav"><button class="btn ghost" style="border-color:var(--dim);color:var(--dim)" onclick="go({screen:'home'})">← Dashboard</button></div>
    </div></div>`;
}

/* ---------------- ROUTER ---------------- */
/* Wrap whatever a screen rendered into the persistent sidebar layout,
   so the nav is always present and only the centre pane changes. */
function wrapShell(){
  const h=app.innerHTML;
  const i=h.indexOf("</header>");
  if(i<0)return;                            /* sign-in screens have no header */
  if(h.indexOf('class="side"')>=0)return;   /* dashboard + hub already include it */
  app.innerHTML=h.slice(0,i+9)+`<div class="home">${navSidebar()}<div class="pane">${h.slice(i+9)}</div></div>`;
}
function render(){
  if(cloud.on&&!cloud.token){renderCloudAuth();return;}
  if(!currentPid||lg.mode==="code"||lg.mode==="verify"){renderLogin();return;}
  if(S.screen!=="stats"){lg.shownCode=null;lg.copied=false;secMsg="";}
  switch(S.screen){
    case"home":clearInterval(bzTimer);clearInterval(exTimer);renderHome();break;
    case"levels":renderLevels();break;
    case"diag":if(!dg.deck||dg.track!==(S.track||null)||S.fresh){startDiag(S.track);S.fresh=false;}renderDiag();break;
    case"diagReport":renderDiagReport();break;
    case"gate":if(!gt.deck||gt.track!==S.track||gt.level!==S.level||S.fresh){startGate(S.track,S.level);S.fresh=false;}renderGate();break;
    case"stats":renderStats();break;
    case"learn":renderLearn();break;
    case"sandbox":renderSandbox();break;
    case"tasks":renderTasks();break;
    case"commands":renderCommands();break;
    case"cmdlab":if(cl.track!==S.track||!cl.deck||S.fresh){startCmd(S.track);S.fresh=false;}renderCmd();break;
    case"lab":if(!lb.lab||lb.lab.id!==S.id||lb.done&&S.fresh||S.fresh){startLab(S.id);S.fresh=false;}renderLab();break;
    case"quiz":if(quiz.track!==S.track||quiz.level!==S.level||quiz.smart||!quiz.deck||S.fresh){startQuiz(S.track,false,S.level);S.fresh=false;}renderQuiz();break;
    case"smart":if(!quiz.smart||!quiz.deck||S.fresh){startQuiz(null,true);S.fresh=false;}renderQuiz();break;
    case"cards":if(fc.track!==S.track||!fc.deck||S.fresh){startCards(S.track);S.fresh=false;}renderCards();break;
    case"blitz":if(!bz.deck||S.fresh){startBlitz();S.fresh=false;}renderBlitz();break;
    case"examIntro":renderExamIntro();break;
    case"exam":if(!ex.deck||ex.done||ex.track!==S.track||S.fresh){startExam(S.track);S.fresh=false;}renderExam();break;
    case"examReport":renderExamReport();break;
    case"scenList":renderScenList();break;
    case"scen":if(sc.id!==S.id||S.fresh){sc={id:S.id,picked:null,back:S.back||null};S.fresh=false;}renderScenario();break;
    case"explain":if(!epx.deck||S.fresh){startExplain();S.fresh=false;}renderExplain();break;
    case"missed":renderMissed();break;
  }
  wrapShell();
}
/* ---------------- BACK NAVIGATION ---------------- */
/* Every jump is remembered, so the browser Back button, the header arrow,
   and a right-swipe on mobile all return you to where you were. */
let navStack=[];
window.goBack=function(){
  if(navStack.length){S=navStack.pop();render();}
  else if((S.screen||"home")!=="home"){S={screen:"home"};render();}
  try{window.scrollTo(0,0);}catch(e){}
};
function pushHistory(){
  try{if(typeof history!=="undefined"&&history.pushState)history.pushState({n:navStack.length},"");}catch(e){}
}
try{
  if(typeof window!=="undefined"&&window.addEventListener){
    window.addEventListener("popstate",function(){window.goBack();});
    let sx=0,sy=0,st=0;
    document.addEventListener("touchstart",function(e){const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;st=Date.now();},{passive:true});
    document.addEventListener("touchend",function(e){
      const t=e.changedTouches[0], dx=t.clientX-sx, dy=Math.abs(t.clientY-sy), dt=Date.now()-st;
      if(dy>70||dt>900)return;
      let n=e.target;                                   /* ignore sideways-scrolling areas */
      while(n&&n.hasAttribute){ if(n.hasAttribute("data-noswipe"))return; n=n.parentNode; }
      if((sx<60&&dx>70)||dx>150)window.goBack();
    },{passive:true});
  }
}catch(e){}

/* fresh flags so re-entering a mode restarts it */
const _go=go;
window.go=function(v){
  if(currentPid&&S&&S.screen&&S.screen!==v.screen){navStack.push({...S});if(navStack.length>40)navStack.shift();}
  v.fresh=true;_go(v);pushHistory();
};

loadProfiles();
if(currentPid)load();
render();
bootCloud();
</script>
