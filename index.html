<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06090F; --panel:rgba(148,175,215,.05); --panel2:rgba(148,175,215,.10); --line:rgba(148,175,215,.14);
    --text:#E9EEF7; --dim:#8C97AC; --amber:#FFB347; --cyan:#3FD6C6;
    --red:#F4634E; --blue:#5B9DFF; --purple:#B08CFF; --green:#7BD88F;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scrollbar-color:rgba(148,175,215,.25) transparent}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;padding-bottom:56px}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
    radial-gradient(600px 420px at 12% -4%, rgba(255,150,60,.13), transparent 65%),
    radial-gradient(720px 520px at 96% 100%, rgba(63,214,198,.10), transparent 65%),
    radial-gradient(480px 360px at 70% 8%, rgba(91,157,255,.07), transparent 60%);}
  #app{max-width:1120px;margin:0 auto;padding:0 18px}
  header{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    padding:14px 4px;margin:0 -4px 22px;background:rgba(6,9,15,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line)}
  .logo{background:none;border:none;cursor:pointer;text-align:left;padding:0;margin-right:auto}
  .logo h1{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--text);letter-spacing:1px}
  .logo h1 span{color:var(--amber)}
  .logo small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:2.5px;color:var(--dim);text-transform:uppercase;margin-top:2px}
  .hdr-xp{font-family:var(--mono);font-size:12px;color:var(--amber);background:var(--panel);border:1px solid var(--line);
    border-radius:99px;padding:7px 14px}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
  .btn{font-family:var(--mono);font-size:12.5px;letter-spacing:1px;text-transform:uppercase;padding:11px 20px;
       cursor:pointer;border-radius:11px;font-weight:700;transition:transform .12s,box-shadow .2s,opacity .2s;
       border:1px solid var(--amber);background:linear-gradient(135deg,#FFC167,#FFA22E);color:#0B1220;
       box-shadow:0 8px 24px -10px rgba(255,179,71,.45)}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;box-shadow:none}
  .btn.ghost:hover{background:var(--panel)}
  .btn:disabled{opacity:.35;cursor:default;transform:none}
  .btn:focus-visible,.opt:focus-visible,.card-flip:focus-visible,.navlink:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .panel{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:var(--r);padding:18px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 12px 32px -20px rgba(0,0,0,.8)}
  .grid{display:grid;gap:12px}
  .home{display:grid;grid-template-columns:248px 1fr;gap:20px;align-items:start}
  .side{display:grid;gap:14px;position:sticky;top:76px}
  .main-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .span2{grid-column:1/-1}
  .pane{min-width:0}
  @media(max-width:920px){
    .home{grid-template-columns:1fr}
    .side{position:static;order:2}
    .main-grid{grid-template-columns:1fr}
  }
  .navlink{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:11px;border:1px solid transparent;
    background:none;color:var(--dim);font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;
    transition:background .15s,color .15s}
  .navlink:hover{background:var(--panel2);color:var(--text)}
  .navlink.on{background:var(--panel2);border-color:var(--line);color:var(--text)}
  .navlink .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .chip{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
    box-shadow:0 6px 18px -8px rgba(0,0,0,.7)}
  .feat{display:flex;flex-direction:column;gap:10px}
  .feat .fh{display:flex;align-items:center;gap:12px}
  .feat h3{font-size:15.5px;font-weight:700;letter-spacing:.2px}
  .feat p{font-size:12.5px;color:var(--dim);line-height:1.5}
  .track h3{font-size:17px;font-weight:700}
  .track p{font-size:13px;color:var(--dim);margin-top:2px}
  .track .row{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
  .track .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .stat{font-family:var(--mono);font-size:11px}
  .osi-row{position:relative;height:22px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .osi-fill{position:absolute;inset:0;background:rgba(255,179,71,.22);transition:width .4s ease}
  .osi-lbl{position:relative;display:flex;justify-content:space-between;align-items:center;height:100%;padding:0 8px;font-family:var(--mono);font-size:10.5px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 15px;background:var(--panel2);
       border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:15px;cursor:pointer;font-family:var(--sans);line-height:1.45;width:100%;
       transition:border-color .15s,background .15s}
  .opt:hover{border-color:rgba(148,175,215,.32)}
  .opt .mk{font-family:var(--mono);font-size:12px;color:var(--dim);min-width:16px;padding-top:2px}
  .opt.correct{border-color:var(--cyan);background:rgba(63,214,198,.10)}
  .opt.correct .mk{color:var(--cyan)}
  .opt.wrong{border-color:var(--red);background:rgba(244,99,78,.10)}
  .opt.wrong .mk{color:var(--red)}
  .opt.sel{border-color:var(--blue);background:rgba(91,157,255,.10)}
  .explain{margin-top:16px;padding:14px 16px;background:var(--panel2);border-left:3px solid var(--cyan);border-radius:10px;font-size:14px;line-height:1.55}
  .explain.bad{border-left-color:var(--red)}
  .explain .tag{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1px}
  .nav{display:flex;justify-content:space-between;margin-top:16px;gap:10px;flex-wrap:wrap;align-items:center}
  .card-flip{width:100%;min-height:230px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:28px;
             cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;transition:border-color .2s;color:var(--text)}
  .qbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-family:var(--mono);font-size:12px;gap:8px;flex-wrap:wrap}
  .tbar{height:5px;background:var(--panel2);border-radius:3px;margin-bottom:16px;overflow:hidden}
  .tbar div{height:100%;background:linear-gradient(90deg,#FFC167,#FFA22E);transition:width 1s linear}
  .tbar.low div{background:var(--red)}
  .exam-map{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .exam-map button{width:34px;height:30px;font-family:var(--mono);font-size:11px;border-radius:8px;border:1px solid var(--line);
                   background:var(--panel2);color:var(--dim);cursor:pointer}
  .exam-map button.answered{border-color:var(--blue);color:var(--text)}
  .exam-map button.flagged{border-color:var(--amber);color:var(--amber)}
  .exam-map button.cur{background:var(--blue);color:#0B1220;border-color:var(--blue)}
  .report-dom{display:flex;align-items:center;gap:10px;font-size:13px}
  .report-dom .bar{flex:1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .report-dom .bar div{height:100%}
  .big{font-family:var(--mono);font-size:54px;font-weight:700}
  .center{text-align:center}
  .miss-item{padding:13px 15px;background:var(--panel2);border-radius:12px;font-size:14px;line-height:1.5;border-left:3px solid var(--red)}
  .miss-item .x{color:var(--dim);font-size:13px;margin-top:6px}
  h2.screen-title{font-size:21px;font-weight:800;letter-spacing:-.2px}
  input[type="text"]{border-radius:0}
  @media(prefers-reduced-motion:reduce){*{transition:none !important}}
  footer{position:fixed;bottom:0;left:0;right:0;background:rgba(6,9,15,.85);backdrop-filter:blur(12px);border-top:1px solid var(--line);
         font-family:var(--mono);font-size:10px;color:var(--dim);text-align:center;padding:8px;letter-spacing:1px;z-index:30}
</style>
</head>

<script>
"use strict";
/* ============================ STORAGE SHIM ============================ */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};

/* ============================ CONFIG ============================ */
const OSI=["Physical","Data Link","Network","Transport","Session","Presentation","Application"];
const XP_LAYER=250;
const TRACKS={
  netplus:{name:"Network+",short:"N+",color:"#5B9DFF",hex:"#5B9DFF",desc:"CompTIA fundamentals: OSI, cabling, IP, ports",pass:80,examQ:20,examMin:30},
  ccna:{name:"CCNA",short:"CCNA",color:"#3FD6C6",hex:"#3FD6C6",desc:"Cisco routing, switching, VLANs, subnetting",pass:82,examQ:20,examMin:30},
  secplus:{name:"Security+",short:"S+",color:"#B08CFF",hex:"#B08CFF",desc:"CompTIA security: crypto, attacks, controls",pass:83,examQ:20,examMin:30},
  ccnp:{name:"CCNP",short:"CCNP",color:"#FFB347",hex:"#FFB347",desc:"Advanced routing: OSPF, BGP, redistribution",pass:82,examQ:20,examMin:35},
  paloalto:{name:"Palo Alto",short:"PAN",color:"#7BD88F",hex:"#7BD88F",desc:"PAN-OS firewalls: zones, App-ID, NAT, Panorama (PCNSA/PCNSE)",pass:80,examQ:20,examMin:30},
};
const LV={1:{n:"Beginner",c:"#5B9DFF"},2:{n:"Intermediate",c:"#3FD6C6"},3:{n:"Advanced",c:"#FFB347"},4:{n:"Expert",c:"#F4634E"}};
const lvOf=q=>q.lv||2;

/* ============================ QUESTION BANK ============================ */
/* {t:track, d:domain, q, a:[4], c:correctIndex, x:explanation} */
const Q=[
/* ---------------- NETWORK+ ---------------- */
{t:"netplus",lv:1,d:"Fundamentals",q:"Which OSI layer is responsible for logical addressing and routing?",a:["Layer 2 – Data Link","Layer 3 – Network","Layer 4 – Transport","Layer 5 – Session"],c:1,x:"Layer 3 (Network) handles logical addressing (IP) and path selection between networks. Layer 2 uses physical MAC addresses within a segment."},
{t:"netplus",lv:1,d:"Fundamentals",q:"What is the default port for HTTPS?",a:["80","8080","443","22"],c:2,x:"HTTPS uses TCP 443. HTTP is 80, SSH is 22, and 8080 is a common alternate HTTP port."},
{t:"netplus",d:"Implementation",q:"Which cable type is immune to electromagnetic interference (EMI)?",a:["Cat6 UTP","Coaxial","Fiber optic","Cat5e STP"],c:2,x:"Fiber carries light, not electrical signals, so EMI has no effect. Shielded copper only reduces EMI, it doesn't eliminate it."},
{t:"netplus",d:"Fundamentals",q:"A /26 subnet provides how many usable host addresses?",a:["62","64","30","126"],c:0,x:"/26 leaves 6 host bits → 2⁶ = 64 addresses, minus network and broadcast = 62 usable."},
{t:"netplus",lv:1,d:"Fundamentals",q:"Which protocol resolves an IP address to a MAC address?",a:["DNS","DHCP","ARP","ICMP"],c:2,x:"ARP maps IPv4 addresses to MAC addresses on a local segment. DNS maps names to IPs."},
{t:"netplus",lv:1,d:"Implementation",q:"Which device operates primarily at OSI Layer 2?",a:["Router","Switch","Hub","Firewall"],c:1,x:"A switch forwards frames based on MAC addresses (Layer 2). A hub is Layer 1, routers are Layer 3."},
{t:"netplus",lv:1,d:"Operations",q:"What does a DHCP server provide to clients?",a:["Name-to-IP resolution","IP address, mask, gateway, DNS","MAC address filtering","Certificate validation"],c:1,x:"DHCP automatically leases IP configuration: address, subnet mask, default gateway, and DNS servers (the DORA process)."},
{t:"netplus",lv:1,d:"Fundamentals",q:"Port 53 is used by which service?",a:["SMTP","DNS","SNMP","FTP"],c:1,x:"DNS uses port 53 (UDP for queries, TCP for zone transfers). SMTP is 25, SNMP is 161, FTP is 20/21."},
{t:"netplus",lv:1,d:"Fundamentals",q:"Which topology has every node connected to every other node?",a:["Star","Bus","Ring","Full mesh"],c:3,x:"Full mesh connects every node to all others — maximum redundancy at n(n-1)/2 links. Common in WAN cores, rare in LANs."},
{t:"netplus",d:"Implementation",q:"What is the purpose of 802.1Q?",a:["Wireless encryption","VLAN tagging on trunk links","Spanning tree","Link aggregation"],c:1,x:"802.1Q inserts a 4-byte VLAN tag into Ethernet frames so multiple VLANs can share one trunk link."},
{t:"netplus",lv:1,d:"Operations",q:"Which record type maps a hostname to an IPv6 address?",a:["A","AAAA","CNAME","MX"],c:1,x:"AAAA ('quad-A') records map names to IPv6 addresses. A records are IPv4, CNAME is an alias, MX is mail."},
{t:"netplus",d:"Troubleshooting",q:"Which tool verifies a cable's wire pairs are terminated correctly?",a:["Toner probe","Cable tester","OTDR","Spectrum analyzer"],c:1,x:"A cable tester verifies pinouts and continuity. A toner probe locates cables; an OTDR tests fiber; a spectrum analyzer inspects RF."},
{t:"netplus",d:"Implementation",q:"Which WAN technology forwards traffic using labels instead of IP lookups?",a:["Frame Relay","MPLS","Metro Ethernet","ISDN"],c:1,x:"MPLS attaches labels to packets and forwards on label swaps — fast, supports traffic engineering and provider VPNs."},
{t:"netplus",d:"Implementation",q:"What is the maximum run length for 1000BASE-T over Cat5e/Cat6?",a:["55 m","100 m","185 m","550 m"],c:1,x:"Copper Ethernet (10/100/1000BASE-T) is limited to 100 meters including patch cables. Beyond that, use fiber."},
{t:"netplus",d:"Operations",q:"Which protocol keeps device clocks synchronized?",a:["SNMP","NTP","Syslog","ICMP"],c:1,x:"NTP (UDP 123) synchronizes clocks — critical for log correlation, certificates, and authentication."},
{t:"netplus",d:"Fundamentals",q:"Which media access method do Wi-Fi networks use?",a:["CSMA/CD","CSMA/CA","Token passing","Polling"],c:1,x:"Wireless can't detect collisions while transmitting, so 802.11 uses Collision Avoidance — wait, then transmit, with ACKs."},
{t:"netplus",lv:1,d:"Fundamentals",q:"What is the IPv4 loopback address?",a:["0.0.0.0","169.254.0.1","127.0.0.1","255.255.255.255"],c:2,x:"127.0.0.1 (the whole 127.0.0.0/8 block) loops traffic back to the local host — used to test the local TCP/IP stack."},
{t:"netplus",lv:3,d:"Troubleshooting",q:"Traceroute maps the path to a destination by manipulating which field?",a:["Window size","TTL","Checksum","DSCP"],c:1,x:"Traceroute sends probes with increasing TTL values; each hop that decrements TTL to zero returns ICMP Time Exceeded, revealing itself."},
{t:"netplus",d:"Troubleshooting",q:"A VoIP call sounds choppy with words arriving unevenly. Which metric is most likely the problem?",a:["Bandwidth","Jitter","MTU","Duplex"],c:1,x:"Jitter is variation in packet delay. Voice needs consistent timing; jitter buffers help, but high jitter causes choppy audio."},
{t:"netplus",d:"Security",q:"Which technology creates an encrypted tunnel for remote workers over the internet?",a:["VLAN","VPN","NAT","QoS"],c:1,x:"A VPN encrypts traffic between a remote client (or site) and the corporate network — commonly IPsec or SSL/TLS-based."},
{t:"netplus",d:"Operations",q:"An address of 169.254.100.7 on a workstation most likely means:",a:["Static misconfiguration","DHCP server unreachable (APIPA)","DNS failure","Duplicate IP"],c:1,x:"169.254.0.0/16 is APIPA — the host self-assigned an address after failing to reach a DHCP server."},
{t:"netplus",d:"Security",q:"Which port-based standard authenticates devices before granting LAN access?",a:["802.11i","802.1X","802.3af","802.1D"],c:1,x:"802.1X uses a supplicant, authenticator (switch/AP), and RADIUS server to authenticate before the port passes traffic."},

/* ---------------- CCNA ---------------- */
{t:"ccna",lv:1,d:"IP Connectivity",q:"Which command displays the routing table on a Cisco router?",a:["show ip interface brief","show running-config","show ip route","show cdp neighbors"],c:2,x:"'show ip route' displays the routing table with route sources (C, S, O, B codes), metrics, and next hops."},
{t:"ccna",lv:1,d:"IP Connectivity",q:"What is the administrative distance of OSPF?",a:["90","110","120","1"],c:1,x:"OSPF is 110. EIGRP is 90, RIP is 120, static routes are 1, connected routes are 0. Lower AD wins."},
{t:"ccna",d:"Network Fundamentals",q:"Network 192.168.10.0/24 needs 4 equal subnets. Which mask do you use?",a:["/25","/26","/27","/28"],c:1,x:"4 subnets need 2 borrowed bits: /24 + 2 = /26, giving four subnets of 62 usable hosts each."},
{t:"ccna",d:"Network Access",q:"Which STP port state forwards traffic while learning MACs?",a:["Blocking","Listening","Learning","Forwarding"],c:3,x:"Only Forwarding passes user traffic. Learning populates the MAC table but doesn't forward; Blocking and Listening drop data frames."},
{t:"ccna",d:"Network Access",q:"What does 'switchport mode trunk' do?",a:["Assigns the port to VLAN 1","Carries multiple VLANs with 802.1Q tags","Enables port security","Disables the port"],c:1,x:"Trunk mode carries traffic for multiple VLANs, tagging frames with 802.1Q. Access mode carries a single untagged VLAN."},
{t:"ccna",lv:1,d:"Network Access",q:"Which protocol prevents Layer 2 loops?",a:["OSPF","HSRP","STP","VTP"],c:2,x:"Spanning Tree Protocol blocks redundant paths to prevent broadcast storms and MAC table instability in switched loops."},
{t:"ccna",lv:3,d:"Network Fundamentals",q:"What is the broadcast address of 172.16.32.0/20?",a:["172.16.32.255","172.16.47.255","172.16.63.255","172.16.39.255"],c:1,x:"/20 blocks increment by 16 in the third octet: 172.16.32.0–172.16.47.255. Broadcast = 172.16.47.255."},
{t:"ccna",d:"IP Services",q:"Which NAT type maps many private IPs to one public IP using ports?",a:["Static NAT","Dynamic NAT","PAT (overload)","NAT64"],c:2,x:"PAT (Port Address Translation, 'NAT overload') multiplexes many inside hosts onto one public IP by tracking port numbers."},
{t:"ccna",d:"IP Connectivity",q:"In OSPF, what is elected on a multi-access network to reduce adjacencies?",a:["Root bridge","DR and BDR","Active router","Stub router"],c:1,x:"The Designated Router and Backup DR form adjacencies with all routers (highest priority, then highest router ID)."},
{t:"ccna",lv:1,d:"Network Fundamentals",q:"Which command saves the running config to NVRAM?",a:["copy startup-config running-config","write erase","copy running-config startup-config","reload"],c:2,x:"'copy running-config startup-config' (or legacy 'write memory') persists the active config so it survives a reboot."},
{t:"ccna",lv:1,d:"Network Access",q:"What does CDP provide?",a:["Loop prevention","Directly connected Cisco device discovery","Route summarization","VLAN propagation"],c:1,x:"Cisco Discovery Protocol advertises device ID, platform, and connected port to directly attached neighbors."},
{t:"ccna",d:"Network Fundamentals",q:"Which IPv6 address type is equivalent to a private IPv4 address?",a:["Link-local (FE80::/10)","Unique local (FC00::/7)","Global unicast","Anycast"],c:1,x:"Unique local addresses (FC00::/7, commonly FD00::/8) are routable inside an organization but not on the internet — like RFC 1918."},
{t:"ccna",lv:1,d:"Network Access",q:"What is the default VLAN on a Cisco switch?",a:["VLAN 0","VLAN 1","VLAN 10","VLAN 4094"],c:1,x:"All ports default to VLAN 1, which is also the default native VLAN — best practice is to move user traffic and the native VLAN off it."},
{t:"ccna",d:"Security",q:"What is the default port-security violation mode?",a:["Protect","Restrict","Shutdown","Alert"],c:2,x:"Shutdown err-disables the port on violation. Restrict drops and logs; Protect silently drops."},
{t:"ccna",d:"IP Connectivity",q:"What does 'ip route 0.0.0.0 0.0.0.0 203.0.113.1' configure?",a:["A null route","A default route to 203.0.113.1","A host route","A summary of RFC 1918 space"],c:1,x:"0.0.0.0/0 matches everything — the gateway of last resort when no more specific route exists."},
{t:"ccna",d:"IP Connectivity",q:"How does OSPF select its router ID when none is configured manually?",a:["Lowest interface IP","Highest loopback IP, else highest interface IP","Random 32-bit value","MAC of the first interface"],c:1,x:"Priority order: manual router-id → highest loopback address → highest active physical interface address."},
{t:"ccna",lv:4,d:"Network Access",q:"Two switch ports are set to DTP 'dynamic auto' on both ends. What forms?",a:["Trunk","Access link","Err-disabled port","EtherChannel"],c:1,x:"Dynamic auto only responds to negotiation — it never initiates. Auto+auto = access. At least one side must be 'desirable' or hard-set trunk."},
{t:"ccna",d:"Security",q:"What wildcard mask matches all hosts in 10.1.1.0/24 in an ACL?",a:["255.255.255.0","0.0.0.255","0.255.255.255","0.0.255.255"],c:1,x:"Wildcard masks invert subnet masks: 0 bits must match, 1 bits are ignored. /24 → 0.0.0.255."},
{t:"ccna",d:"Security",q:"A standard ACL filters traffic based on:",a:["Source and destination IP","Source IP only","Ports and protocols","MAC addresses"],c:1,x:"Standard ACLs (1–99) match source IP only — so place them close to the destination. Extended ACLs match source, destination, protocol, and ports."},
{t:"ccna",d:"IP Services",q:"How is the HSRP active router elected?",a:["Lowest IP address","Highest priority, then highest IP","First router booted always keeps the role","Lowest MAC address"],c:1,x:"Highest priority (default 100) wins; highest interface IP breaks ties. Without preemption, a later higher-priority router won't take over."},
{t:"ccna",d:"IP Services",q:"In NTP, what does a lower stratum number indicate?",a:["Less accurate time","Closer to the authoritative time source","A backup server","An unsynchronized clock"],c:1,x:"Stratum 0 is the reference clock itself; stratum 1 servers connect to it directly. Each hop away adds one stratum."},
{t:"ccna",d:"IP Connectivity",q:"What does CEF use to forward packets in hardware?",a:["Routing table lookups per packet","FIB and adjacency table","ARP broadcasts","Process switching"],c:1,x:"Cisco Express Forwarding precomputes the FIB (from the RIB) and adjacency table (from ARP), avoiding per-packet route lookups."},

/* ---------------- SECURITY+ ---------------- */
{t:"secplus",lv:1,d:"Concepts",q:"Which principle states users should only have access needed for their job?",a:["Separation of duties","Least privilege","Defense in depth","Zero trust"],c:1,x:"Least privilege limits each user or process to the minimum access required — the core control for limiting blast radius."},
{t:"secplus",lv:1,d:"Threats",q:"What kind of attack floods a target to exhaust its resources?",a:["Phishing","DDoS","SQL injection","MITM"],c:1,x:"A Distributed Denial of Service attack overwhelms bandwidth, connections, or CPU from many sources so legitimate traffic can't get through."},
{t:"secplus",lv:1,d:"Architecture",q:"Which encryption type uses the same key to encrypt and decrypt?",a:["Asymmetric","Symmetric","Hashing","Elliptic curve"],c:1,x:"Symmetric ciphers (AES, ChaCha20) use one shared key — fast, but key distribution is the challenge asymmetric crypto solves."},
{t:"secplus",d:"Architecture",q:"What does a hash function guarantee about data?",a:["Confidentiality","Availability","Integrity","Non-repudiation"],c:2,x:"Hashes (SHA-256) produce a fixed fingerprint; any change to the data changes the hash, proving integrity. They don't encrypt anything."},
{t:"secplus",d:"Threats",q:"An attacker tricks an employee by pretending to be IT support on the phone. This is:",a:["Vishing","Smishing","Whaling","Tailgating"],c:0,x:"Vishing is voice-call social engineering. Smishing is via SMS, whaling targets executives, tailgating is physical entry."},
{t:"secplus",d:"Operations",q:"Which control type is a security camera?",a:["Preventive","Detective","Corrective","Compensating"],c:1,x:"Cameras detect and record events — they don't stop them. A locked door is preventive; restoring from backup is corrective."},
{t:"secplus",d:"Architecture",q:"What is the primary purpose of a DMZ (screened subnet)?",a:["Encrypt internal traffic","Host public-facing services isolated from the LAN","Store backups","Aggregate logs"],c:1,x:"A screened subnet places web/mail servers between firewalls so a compromise of a public server doesn't expose the internal network."},
{t:"secplus",lv:1,d:"Concepts",q:"Which authentication factor is a fingerprint?",a:["Something you know","Something you have","Something you are","Somewhere you are"],c:2,x:"Biometrics are 'something you are.' Passwords are knowledge, tokens/phones are possession, geolocation is location."},
{t:"secplus",d:"Threats",q:"What does a rainbow table attack target?",a:["Encrypted TLS sessions","Password hashes","DNS records","Firewall rules"],c:1,x:"Rainbow tables are precomputed hash lookups used to reverse unsalted password hashes. Salting defeats them."},
{t:"secplus",lv:1,d:"Operations",q:"Which protocol secures remote CLI management, replacing Telnet?",a:["SNMPv2","SSH","RDP","TFTP"],c:1,x:"SSH (TCP 22) encrypts the entire session. Telnet (23) sends everything, including credentials, in cleartext."},
{t:"secplus",d:"Operations",q:"What is the purpose of a SIEM?",a:["Blocking malware at the endpoint","Centralized log collection, correlation, and alerting","Encrypting data at rest","Managing PKI certificates"],c:1,x:"A SIEM aggregates logs from many sources, correlates events, and raises alerts — the heart of a SOC's visibility."},
{t:"secplus",d:"Threats",q:"An attacker intercepts and relays traffic between two parties who believe they're talking directly. This is:",a:["Replay attack","On-path (MITM) attack","DNS poisoning","Privilege escalation"],c:1,x:"An on-path attacker sits between victims, reading or altering traffic. TLS with certificate validation is the main defense."},
{t:"secplus",d:"Threats",q:"Phishing that targets one specific individual or organization is called:",a:["Pharming","Spear phishing","Typosquatting","Watering hole"],c:1,x:"Spear phishing is customized to its target using researched details. Whaling is spear phishing aimed at executives."},
{t:"secplus",d:"Architecture",q:"In PKI, what is the role of a Certificate Authority?",a:["Encrypt all web traffic","Issue and digitally sign certificates","Store private keys for users","Rotate symmetric keys"],c:1,x:"The CA verifies identity and signs certificates, creating the chain of trust browsers and systems validate."},
{t:"secplus",d:"Operations",q:"An IDS alerts on traffic that is actually benign. This is a:",a:["False negative","True positive","False positive","True negative"],c:2,x:"False positives are benign events flagged as malicious — they burn analyst time. False negatives are real attacks that go undetected (worse)."},
{t:"secplus",d:"Architecture",q:"What is the key difference between an IDS and an IPS?",a:["IDS is hardware, IPS is software","IPS sits inline and can block; IDS only detects and alerts","IDS encrypts traffic","IPS works only at Layer 2"],c:1,x:"An IPS is placed inline in the traffic path and can drop malicious packets. An IDS monitors a copy of traffic and alerts."},
{t:"secplus",d:"Threats",q:"Which attack injects malicious scripts that execute in other users' browsers?",a:["SQL injection","Cross-site scripting (XSS)","Buffer overflow","Directory traversal"],c:1,x:"XSS injects script into pages viewed by other users, stealing sessions or credentials. Output encoding and CSP are key defenses."},
{t:"secplus",d:"Operations",q:"What is the primary defense against SQL injection?",a:["Longer passwords","Parameterized queries / prepared statements","Full disk encryption","Rate limiting"],c:1,x:"Parameterized queries separate code from data so user input can never be executed as SQL. Input validation helps as defense in depth."},
{t:"secplus",d:"Operations",q:"RPO (Recovery Point Objective) defines:",a:["Maximum tolerable downtime","Maximum acceptable data loss measured in time","Time to detect an incident","Backup media rotation schedule"],c:1,x:"RPO is how much data you can afford to lose (drives backup frequency). RTO is how fast you must be back up (downtime)."},
{t:"secplus",lv:1,d:"Operations",q:"What is a honeypot used for?",a:["Encrypting sensitive files","Attracting attackers to study their methods and divert them","Filtering spam","Load balancing"],c:1,x:"A honeypot is a decoy system that looks valuable; interaction with it signals an attacker and reveals their tools and tactics."},
{t:"secplus",lv:1,d:"Concepts",q:"Full disk encryption primarily protects data in which state?",a:["In transit","In use","At rest","In processing"],c:2,x:"FDE protects data at rest — a stolen laptop's drive is unreadable. TLS protects data in transit; data in use requires other controls."},
{t:"secplus",lv:1,d:"Concepts",q:"What does CVE stand for and provide?",a:["Common Vulnerabilities and Exposures — standardized vulnerability identifiers","Certified Vulnerability Evaluation — pentest certification","Central Virus Engine — AV signatures","Common Verification Exchange — cert validation"],c:0,x:"CVE IDs (e.g., CVE-2024-3094) give every disclosed vulnerability a unique reference so tools and teams can talk about the same flaw."},

/* ---------------- CCNP ---------------- */
{t:"ccnp",d:"BGP",q:"In BGP, which attribute is checked first in Cisco's best-path selection?",a:["AS-path length","Weight","Local preference","MED"],c:1,x:"Cisco checks Weight first (proprietary, local to the router), then Local Preference, then locally originated, then AS-path length, origin, MED…"},
{t:"ccnp",d:"OSPF",q:"Which OSPF LSA type describes routes redistributed from another protocol?",a:["Type 1","Type 3","Type 5","Type 2"],c:2,x:"Type 5 (AS External) LSAs carry redistributed routes, originated by the ASBR. Type 1 is Router, Type 2 Network, Type 3 Summary."},
{t:"ccnp",lv:3,d:"BGP",q:"What problem does BGP route reflection solve?",a:["Slow convergence","iBGP full-mesh scaling","Route flapping","Asymmetric routing"],c:1,x:"iBGP requires a full mesh since iBGP-learned routes aren't re-advertised to iBGP peers. Route reflectors relay routes, eliminating the mesh."},
{t:"ccnp",lv:3,d:"OSPF",q:"Which OSPF area type blocks Type 5 LSAs but allows Type 7?",a:["Stub","Totally stubby","NSSA","Backbone"],c:2,x:"A Not-So-Stubby Area blocks external Type 5 LSAs but lets an internal ASBR inject externals as Type 7, converted to Type 5 at the ABR."},
{t:"ccnp",d:"Path Control",q:"What is the purpose of a route-map when redistributing?",a:["Load balancing","Filtering and modifying routes with match/set logic","Encrypting updates","Neighbor authentication"],c:1,x:"Route-maps match prefixes/attributes and set metrics, tags, or attributes — the primary tool for controlled redistribution and preventing loops."},
{t:"ccnp",lv:1,d:"Services",q:"Which first-hop redundancy protocol is an open standard?",a:["HSRP","GLBP","VRRP","DTP"],c:2,x:"VRRP is the IETF standard (RFC 5798). HSRP and GLBP are Cisco proprietary. GLBP adds active load balancing."},
{t:"ccnp",lv:3,d:"EIGRP",q:"In EIGRP, what is a feasible successor?",a:["The best route in the topology table","A backup route meeting the feasibility condition","A route in active state","The neighbor with lowest IP"],c:1,x:"A feasible successor is a loop-free backup whose reported distance is less than the successor's feasible distance — instant failover, no query."},
{t:"ccnp",lv:3,d:"OSPF",q:"What does 'ip ospf network point-to-point' on an Ethernet link change?",a:["Enables authentication","Skips DR/BDR election and speeds adjacency","Raises the MTU","Forces area 0 membership"],c:1,x:"On a two-router link, point-to-point mode skips DR/BDR election and forms adjacency faster — a common tuning on routed uplinks."},
{t:"ccnp",d:"Services",q:"Which VPN technology builds dynamic spoke-to-spoke tunnels over a hub?",a:["Site-to-site IPsec","DMVPN","GRE only","SSL VPN"],c:1,x:"DMVPN uses mGRE + NHRP (usually with IPsec) so spokes discover each other and build direct tunnels on demand."},
{t:"ccnp",lv:1,d:"Services",q:"What does BFD provide to routing protocols?",a:["Encryption of hellos","Sub-second failure detection","Route summarization","Loop prevention"],c:1,x:"Bidirectional Forwarding Detection sends rapid lightweight hellos; when they stop, it notifies OSPF/BGP/EIGRP immediately, far faster than protocol timers."},
{t:"ccnp",d:"Services",q:"In VRF-lite, what does each VRF instance maintain?",a:["A separate MAC table","A separate routing table and interfaces","A shared global RIB","Only separate ACLs"],c:1,x:"Each VRF has its own routing table and assigned interfaces, letting one router carry overlapping or isolated address spaces."},
{t:"ccnp",lv:4,d:"OSPF",q:"Which command reveals why an OSPF adjacency is stuck in EXSTART?",a:["show ip ospf database","show ip ospf interface (check MTU)","show ip protocols","show ip ospf border-routers"],c:1,x:"EXSTART/EXCHANGE hangs are classically an MTU mismatch — 'show ip ospf interface' shows the interface MTU to compare on both sides."},
{t:"ccnp",lv:3,d:"BGP",q:"Why is 'next-hop-self' commonly applied on iBGP sessions?",a:["To speed up keepalives","So iBGP peers can reach eBGP-learned next hops without knowing external subnets","To force MED comparison","To encrypt the session"],c:1,x:"eBGP routes keep their external next hop. Internal routers may have no route to it; next-hop-self rewrites it to the border router's own address."},
{t:"ccnp",lv:3,d:"OSPF",q:"What is an OSPF virtual link used for?",a:["Encrypting area 0 traffic","Connecting a discontiguous area to the backbone through a transit area","Load balancing between ABRs","Extending hello timers"],c:1,x:"All areas must touch area 0. A virtual link tunnels backbone connectivity across a transit area when physical design can't provide it — a fix, not a design goal."},
{t:"ccnp",lv:3,d:"Path Control",q:"What is the standard mechanism to prevent redistribution loops between two protocols at multiple points?",a:["Increasing all metrics","Route tagging with route-maps to deny re-import","Disabling one redistribution point","Using only default routes"],c:1,x:"Tag routes at redistribution, then deny routes carrying that tag when redistributing back — cleanly blocking loops at mutual redistribution points."},
{t:"ccnp",d:"BGP",q:"What are BGP communities used for?",a:["Encrypting BGP sessions","Tagging routes so policies can act on groups of prefixes","Electing the best path","Compressing updates"],c:1,x:"Communities are optional transitive tags (e.g., 65000:100) attached to prefixes; upstream policies match them to set local-pref, filter, or control advertisement."},
{t:"ccnp",lv:3,d:"OSPF",q:"With default reference bandwidth (100 Mb/s), what is the OSPF cost of a 10 Gb/s link?",a:["1","10","100","1000"],c:0,x:"Cost = reference/interface bandwidth, minimum 1. 100M/10G rounds down to 1 — same as a 1G link, which is why you raise auto-cost reference-bandwidth."},
{t:"ccnp",lv:4,d:"BGP",q:"An eBGP session won't establish between loopbacks of directly connected routers. Likely cause?",a:["Wrong AS numbers","Default eBGP TTL of 1 (need ebgp-multihop or ttl-security)","Missing route reflector","MED mismatch"],c:1,x:"eBGP packets default to TTL 1, assuming directly connected interfaces. Peering between loopbacks needs 'ebgp-multihop 2' (plus routes to the loopbacks)."},
{t:"ccnp",d:"Path Control",q:"What does policy-based routing (PBR) allow that normal routing does not?",a:["Faster convergence","Forwarding decisions based on source, application, or other match criteria instead of only destination","Automatic summarization","Loop-free Layer 2 paths"],c:1,x:"PBR applies a route-map to an interface, overriding the routing table — e.g., sending specific source subnets or applications out a chosen link."},
{t:"ccnp",lv:3,d:"Path Control",q:"How do you make a floating static route fail over automatically when a next hop stops responding (without a routing protocol)?",a:["Increase its AD to 255","IP SLA probe + track object attached to the primary static route","Configure two default routes","Enable CEF"],c:1,x:"An IP SLA probe (e.g., icmp-echo) tied to a track object removes the primary static route when the probe fails, letting the floating static (higher AD) take over."},
{t:"ccnp",lv:3,d:"BGP",q:"Which technique influences INBOUND traffic from the internet toward your AS?",a:["Adjusting local preference","AS-path prepending on advertisements","Setting weight","Raising OSPF cost"],c:1,x:"Prepending your AS multiple times makes your advertised path look longer, steering external networks toward your other link. Local-pref and weight only affect outbound."},
{t:"ccnp",lv:4,d:"EIGRP",q:"An EIGRP route is 'stuck in active' (SIA). What is happening?",a:["The route is being load balanced","The router queried neighbors for a lost route and replies never came back","Authentication failed","The route was summarized"],c:1,x:"When a successor is lost with no feasible successor, EIGRP goes active and queries neighbors. Unanswered queries (large query domains) cause SIA resets — bounded by stub routers and summarization."},

/* ---- Network+ expansion ---- */
{t:"netplus",lv:1,d:"Fundamentals",q:"Live video streaming tolerates minor loss but not delay. Which transport protocol fits?",a:["TCP","UDP","ICMP","SCTP with retransmission"],c:1,x:"UDP skips handshakes, ordering, and retransmission — a lost frame is better than a late one for live media. TCP's reliability adds delay."},
{t:"netplus",lv:1,d:"Operations",q:"Which DNS record type directs email for a domain?",a:["A","TXT","MX","SRV"],c:2,x:"MX (Mail Exchange) records list the mail servers for a domain, with preference values. TXT often carries SPF/DKIM policy alongside."},
{t:"netplus",lv:1,d:"Fundamentals",q:"Which device separates broadcast domains?",a:["Hub","Switch","Router","Repeater"],c:2,x:"Routers (and L3 boundaries like SVIs) stop broadcasts. Switches separate collision domains but forward broadcasts to every port in the VLAN."},
{t:"netplus",d:"Implementation",q:"Which 2.4 GHz Wi-Fi channels don't overlap in North America?",a:["1, 6, 11","1, 5, 9","2, 7, 12","3, 6, 9"],c:0,x:"2.4 GHz channels are 5 MHz apart but 20 MHz wide — only 1, 6, and 11 fit without overlapping. Adjacent-channel interference is worse than co-channel."},
{t:"netplus",lv:1,d:"Implementation",q:"What does 802.3af/at provide?",a:["Link aggregation","Power over Ethernet","VLAN tagging","Wireless roaming"],c:1,x:"PoE delivers DC power over the data cable — 802.3af (~15 W), 802.3at/PoE+ (~30 W) — powering APs, phones, and cameras without outlets."},
{t:"netplus",lv:3,d:"Troubleshooting",q:"A link runs but shows late collisions and terrible throughput. Classic cause?",a:["DNS failure","Duplex mismatch","Wrong subnet mask","High MTU"],c:1,x:"One side full duplex, the other half: the half-duplex side detects 'collisions' on legitimate simultaneous traffic. Fix speed/duplex settings on both ends."},
{t:"netplus",lv:1,d:"Implementation",q:"Which connector terminates modern fiber patch cables?",a:["RJ45","LC","BNC","DB9"],c:1,x:"LC is the compact fiber connector dominating SFP ports today (SC is the older, larger square one). RJ45 is copper, BNC is coax."},
{t:"netplus",lv:1,d:"Operations",q:"In syslog, severity 0 means:",a:["Debug","Informational","Warning","Emergency"],c:3,x:"Severity runs 0 (emergency — system unusable) to 7 (debug). Lower number = more severe; alerting thresholds are usually set at 0–3."},
{t:"netplus",d:"Operations",q:"What is an SNMP community string?",a:["An encryption key for traps","A shared credential for read/write access in v1/v2c","The device hostname","A VLAN identifier"],c:1,x:"v1/v2c use community strings as plaintext passwords ('public'/'private' defaults are a classic finding). SNMPv3 replaces them with real auth and encryption."},
{t:"netplus",lv:1,d:"Troubleshooting",q:"Which tool shows every router hop between you and a destination?",a:["ping","traceroute / tracert","nslookup","netstat"],c:1,x:"Traceroute reveals the path hop by hop using TTL expiry — ideal for finding WHERE latency or loss begins. Ping only tests the endpoint."},
/* ---- CCNA expansion ---- */
{t:"ccna",lv:3,d:"Network Access",q:"What does VTP do — and why do many shops disable it?",a:["Blocks loops; disabled for speed","Propagates VLAN database across switches; a stale server can wipe VLANs domain-wide","Encrypts trunks; disabled for CPU","Assigns port security; disabled for printers"],c:1,x:"VTP syncs VLAN definitions from servers to clients. A switch with a higher revision number can overwrite the whole domain — the infamous 'VTP bomb' — so many networks run transparent mode."},
{t:"ccna",d:"Network Access",q:"What does PortFast do on an access port?",a:["Increases port speed","Skips STP listening/learning so the port forwards immediately","Enables PoE","Disables the MAC table"],c:1,x:"PortFast bypasses the ~30 s STP wait for edge ports so PCs get link instantly (DHCP won't time out). Pair it with BPDU Guard in case someone plugs in a switch."},
{t:"ccna",lv:3,d:"Network Fundamentals",q:"'show ip interface brief' reports an interface as up/down. Meaning?",a:["Cable unplugged","Physical layer up, line protocol down — L2 problem like encapsulation or keepalives","Administratively shut","IP address missing"],c:1,x:"First column = physical (L1), second = line protocol (L2). up/down means the wire is fine but L2 isn't agreeing — encapsulation mismatch, keepalive failure. down/down is physical; administratively down is 'shutdown'."},
{t:"ccna",d:"Network Access",q:"Which command places subinterface Gi0/0.10 in VLAN 10 for router-on-a-stick?",a:["switchport access vlan 10","encapsulation dot1q 10","vlan 10 tagging","trunk allowed vlan 10"],c:1,x:"Subinterfaces need 'encapsulation dot1q <vlan>' before the IP address — it tells the router which VLAN tag this subinterface answers to."},
{t:"ccna",d:"Security",q:"What does DHCP snooping protect against?",a:["DHCP scope exhaustion only","Rogue DHCP servers answering on untrusted ports","MAC flooding","ARP broadcast storms"],c:1,x:"Snooping marks ports as trusted (toward the real server) or untrusted; DHCP server replies arriving on untrusted ports are dropped, killing rogue-server and man-in-the-middle setups."},
{t:"ccna",lv:1,d:"Network Access",q:"What is 802.1w?",a:["VLAN trunking standard","Rapid Spanning Tree (RSTP) — convergence in ~1–2 s","Wireless QoS","Link aggregation"],c:1,x:"RSTP replaces 802.1D's 30–50 s convergence with proposal/agreement handshakes and edge-port logic, converging in seconds. It's the default 'pvst' variants build on today."},
{t:"ccna",lv:3,d:"Network Access",q:"An EtherChannel won't form. Which mismatch between member ports breaks it?",a:["Different cable lengths","Different speed, duplex, or allowed-VLAN configuration","Different MAC addresses","Different port numbers"],c:1,x:"All bundled ports must be configuration twins: speed, duplex, mode, native and allowed VLANs. Any mismatch suspends the port from the bundle."},
{t:"ccna",lv:1,d:"Network Fundamentals",q:"Every IPv6 interface automatically has an address starting with:",a:["2001::","FC00::","FE80::","FF02::"],c:2,x:"FE80::/10 is link-local, auto-generated on every IPv6 interface and used for neighbor discovery and routing protocol adjacencies. FF02:: is multicast; FC00:: unique local."},
{t:"ccna",d:"Security",q:"A packet matches no line in an ACL. What happens?",a:["It is permitted","It is dropped by the implicit deny","It is logged and forwarded","It is flooded"],c:1,x:"Every Cisco ACL ends with an invisible 'deny any'. Forgetting this — like applying an ACL that only lists denies — blocks everything else too."},
{t:"ccna",lv:3,d:"IP Services",q:"With HSRP preemption disabled, what happens when a higher-priority router comes online?",a:["It immediately becomes active","It waits as standby — the current active keeps the role","Both become active","HSRP resets the group"],c:1,x:"Without 'standby preempt', the sitting active router keeps its role regardless of priority. Preemption is what lets your intended primary reclaim after recovery."},
/* ---- Security+ expansion ---- */
{t:"secplus",lv:1,d:"Threats",q:"An unauthorized person follows an employee through a badge door. Attack and control?",a:["Shoulder surfing — privacy screens","Tailgating — access control vestibule (mantrap)","Dumpster diving — shredders","Impersonation — ID checks"],c:1,x:"Tailgating rides someone else's badge swipe. A vestibule allows exactly one authenticated person through at a time; guards and turnstiles also counter it."},
{t:"secplus",d:"Operations",q:"Which control best guarantees recovery from ransomware?",a:["Stronger perimeter firewall","Offline or immutable backups, tested by restore","Longer passwords","An IDS"],c:1,x:"Modern ransomware hunts and encrypts reachable backups first. Offline/immutable copies it can't touch — plus proven restores — turn extortion into an inconvenience."},
{t:"secplus",lv:1,d:"Threats",q:"What is a zero-day vulnerability?",a:["A bug fixed on release day","A flaw exploited before the vendor has a patch available","Malware that deletes itself","A vulnerability rated zero severity"],c:1,x:"'Zero days' of patch availability — defenders can't patch what has no fix, so compensating controls (segmentation, EDR behavior detection, WAF rules) carry the load."},
{t:"secplus",lv:3,d:"Architecture",q:"What key improvement does WPA3 bring over WPA2-Personal?",a:["Faster speeds","SAE handshake that resists offline password cracking","Longer SSIDs","Mandatory RADIUS"],c:1,x:"WPA2's 4-way handshake can be captured and cracked offline. WPA3's Simultaneous Authentication of Equals makes each guess require a live exchange, neutering dictionary attacks."},
{t:"secplus",d:"Operations",q:"Which knowledge base catalogs real attacker tactics and techniques for detection engineering?",a:["OWASP Top 10","MITRE ATT&CK","ISO 27001","CVSS"],c:1,x:"ATT&CK maps adversary behavior (persistence, lateral movement, exfiltration...) into techniques teams use to build detections and run purple-team exercises. OWASP covers web app flaws; CVSS scores severity."},
{t:"secplus",d:"Architecture",q:"A digital signature provides which two assurances?",a:["Confidentiality and availability","Integrity and non-repudiation","Speed and compression","Anonymity and integrity"],c:1,x:"Signing hashes the message and encrypts the hash with the sender's private key: any tampering breaks it (integrity), and only that key could have made it (non-repudiation). It does NOT encrypt the message."},
{t:"secplus",lv:1,d:"Operations",q:"What does a DLP system do?",a:["Encrypts backups","Detects and blocks sensitive data leaving the organization","Distributes patches","Balances server load"],c:1,x:"Data Loss Prevention inspects email, uploads, and endpoints for patterns like card numbers or classified labels, then blocks or flags exfiltration — accidental or malicious."},
{t:"secplus",d:"Operations",q:"Why detonate a suspicious attachment in a sandbox?",a:["To speed up scanning","To observe its real behavior in isolation before it touches production","To compress it","To strip its metadata"],c:1,x:"Sandboxes run the file in an instrumented, disposable VM and watch what it actually does — catching malware whose signature is brand new."},
{t:"secplus",lv:1,d:"Concepts",q:"A missing patch on a server is best described as a:",a:["Threat","Risk","Vulnerability","Exploit"],c:2,x:"The weakness itself is a vulnerability. The actor/event that might use it is the threat; risk is the likelihood × impact of that combination; the exploit is the tool that does it."},
{t:"secplus",d:"Architecture",q:"Placing all IoT cameras on their own VLAN with strict ACLs is an example of:",a:["Load balancing","Network segmentation to shrink the attack surface","Port mirroring","High availability"],c:1,x:"Unpatchable devices get contained instead of trusted: their own segment, minimum necessary flows, nothing else reachable. Compromise of a camera then goes nowhere."},
/* ---- CCNP expansion ---- */
{t:"ccnp",d:"OSPF",q:"Which router originates Type 3 Summary LSAs?",a:["ASBR","ABR","DR","Any internal router"],c:1,x:"Area Border Routers translate one area's topology into inter-area Type 3 summaries for other areas. ASBRs originate Type 5 externals; DRs originate Type 2 network LSAs."},
{t:"ccnp",lv:3,d:"BGP",q:"What is BGP MED used for?",a:["Choosing between iBGP peers","Suggesting to a NEIGHBORING AS which of multiple links into your AS to prefer","Encrypting updates","Electing route reflectors"],c:1,x:"MED (lower wins) is a hint to an adjacent AS about which entry point you'd like inbound traffic on. It's only compared between routes from the same AS and sits low in the best-path list."},
{t:"ccnp",lv:3,d:"BGP",q:"What does 'neighbor x.x.x.x maximum-prefix 5000' protect against?",a:["Session hijacking","A peer flooding you with excessive routes (leak or misconfig) — session drops or warns at the limit","Slow keepalives","Prefix hijacking by other ASes"],c:1,x:"A full-table leak from a peer can exhaust router memory. Maximum-prefix tears down (or warns on) the session at a sane ceiling — standard edge hygiene."},
{t:"ccnp",lv:3,d:"EIGRP",q:"How does configuring a branch router as EIGRP stub help the whole network?",a:["It advertises more routes","Queries stop at it, bounding the query domain and preventing stuck-in-active events","It becomes the hub","It disables hellos"],c:1,x:"Stub routers announce 'don't query me for lost routes.' In hub-and-spoke designs this keeps a lost route's query storm from radiating through every branch — the SIA cure."},
{t:"ccnp",lv:3,d:"Services",q:"Why run GRE over IPsec instead of plain IPsec between sites?",a:["It's faster","GRE carries multicast — so routing protocols like OSPF/EIGRP can run through the encrypted tunnel","IPsec can't cross NAT","GRE adds encryption"],c:1,x:"Pure IPsec transports unicast only; routing protocol hellos are multicast. GRE wraps anything into unicast packets, IPsec encrypts the GRE — giving you dynamic routing over the VPN."},
{t:"ccnp",d:"Services",q:"What does 'standby 1 preempt' change in HSRP?",a:["Enables authentication","Lets a router with higher priority take over active role when it comes online","Speeds up hellos","Shares load across gateways"],c:1,x:"Without preempt, whoever is active stays active. Preempt lets your intended primary reclaim the role after maintenance or recovery — usually paired with a delay to let its routing converge first."},
{t:"ccnp",d:"OSPF",q:"What does 'passive-interface' do in OSPF?",a:["Shuts the interface","Advertises the interface's subnet but sends no hellos — no adjacencies form on it","Blocks all traffic","Doubles the dead timer"],c:1,x:"User-facing segments should be reachable but shouldn't speak OSPF (rogue adjacency risk, wasted CPU). Passive-interface advertises the prefix while staying silent — many shops default all interfaces passive and unpassive the core links."},
{t:"ccnp",lv:3,d:"Path Control",q:"What does Unicast RPF (uRPF) drop?",a:["Oversized packets","Packets whose SOURCE address isn't reachable back through the arriving interface — i.e., spoofed traffic","IPv6 traffic","Asymmetric but legitimate flows in loose mode"],c:1,x:"uRPF checks the source against the routing table: strict mode requires the reverse path to match the ingress interface, killing spoofed-source packets at the edge (BCP38)."},
{t:"ccnp",lv:1,d:"Services",q:"What visibility does NetFlow/IPFIX give that SNMP counters don't?",a:["Interface up/down state","Per-conversation detail — who talked to whom, ports, bytes — for top-talkers and anomaly detection","CPU temperature","Config change history"],c:1,x:"SNMP says 'this link is 90% full'; NetFlow says exactly which hosts, applications, and flows are filling it. It's the data behind capacity planning and DDoS/exfil detection."},
{t:"ccnp",lv:3,d:"Path Control",q:"Beyond smaller routing tables, what stability benefit does route summarization provide?",a:["Faster interface speeds","A flap inside the summarized range doesn't ripple beyond the summary boundary","Automatic encryption","Higher AD for the summary"],c:1,x:"As long as one component of the summary is up, the summary stays stable — internal churn is invisible outside. Summaries are as much about containing instability as saving memory."},

/* ---- PALO ALTO ---- */
{t:"paloalto",lv:1,d:"Fundamentals",q:"In PAN-OS, what is a security zone?",a:["A VLAN","A logical grouping of interfaces that security policy is written between","An address object","A license type"],c:1,x:"Zones (trust, untrust, dmz...) group interfaces by trust level. Policy is fundamentally zone-to-zone — you allow trust→untrust web, not port-to-port."},
{t:"paloalto",lv:1,d:"Policies",q:"By default, what happens to traffic between two DIFFERENT zones?",a:["Allowed","Denied by the interzone-default rule","Logged and allowed","Automatically NATted"],c:1,x:"Interzone traffic is denied unless a rule allows it. Intrazone (same zone) defaults to allow. Best practice: override the defaults to add logging."},
{t:"paloalto",lv:1,d:"App-ID",q:"What does App-ID identify?",a:["The logged-in user","The actual application in the traffic, regardless of port","The country of origin","The TLS version"],c:1,x:"App-ID inspects traffic content and behavior to name the real application — BitTorrent on port 443 is still identified as BitTorrent, not 'ssl'."},
{t:"paloalto",lv:1,d:"Fundamentals",q:"Which Palo Alto certification is the firewall administrator cert, above entry-level PCCET?",a:["PCNSE","PCNSA","PCSAE","PCDRA"],c:1,x:"The ladder runs PCCET (entry) → PCNSA (administrator) → PCNSE (engineer/expert). PCNSA covers day-to-day firewall admin; PCNSE goes deep on design and troubleshooting."},
{t:"paloalto",lv:1,d:"Fundamentals",q:"What is the management plane responsible for?",a:["Forwarding user packets","Configuration, logging, and admin tasks — separate hardware/CPU from the data plane","Only NAT translations","VPN encryption"],c:1,x:"PAN-OS separates the management plane (config, logs, UI) from the data plane (packet forwarding, inspection) — heavy logging can't starve traffic processing."},
{t:"paloalto",lv:1,d:"User-ID",q:"What does User-ID provide?",a:["Password self-service","Mapping of IP addresses to usernames so policy and logs are user-based","Two-factor authentication","Certificate issuance"],c:1,x:"User-ID pulls IP-to-user mappings from AD logs, agents, or captive portal, letting you write rules like 'contractors may not reach finance-apps' and see usernames in logs."},
{t:"paloalto",lv:1,d:"Threat Prevention",q:"What is WildFire?",a:["An IPS signature pack","A cloud sandbox that detonates unknown files and returns malware verdicts","A URL category database","A VPN client"],c:1,x:"Unknown files are uploaded, detonated in VMs, and analyzed. Malicious verdicts generate signatures pushed to all subscribers — often within minutes."},
{t:"paloalto",lv:1,d:"Policies",q:"What is the default action for traffic within the SAME zone?",a:["Deny","Allow (intrazone-default)","Drop with log","Reset both sides"],c:1,x:"Intrazone traffic is allowed by default — the firewall assumes one zone shares one trust level. Interzone defaults to deny."},
{t:"paloalto",lv:2,d:"Policies",q:"How are security policy rules evaluated?",a:["Best/most-specific match wins","Top-down, first match wins","All matching rules combine","Longest rule name wins"],c:1,x:"Like an ACL: the first rule matching the traffic applies and evaluation stops. Rule ORDER is therefore part of your policy — specific rules go above broad ones."},
{t:"paloalto",lv:2,d:"App-ID",q:"Best practice for the Service column on an App-ID-based allow rule?",a:["any","application-default — allow the app only on its standard ports","tcp/443","service-http"],c:1,x:"'application-default' permits the identified app only on its normal ports — web-browsing on 80, not on 9999 — blocking evasive port-hopping without extra rules."},
{t:"paloalto",lv:2,d:"Threat Prevention",q:"Where do security profiles (Antivirus, Anti-Spyware, Vulnerability Protection...) take effect?",a:["On deny rules","Attached to ALLOW rules — they scan the traffic you permit","On NAT rules","Globally on all traffic automatically"],c:1,x:"Denied traffic needs no scanning. Profiles inspect allowed sessions — an allow rule without profiles is an uninspected tunnel through your firewall."},
{t:"paloalto",lv:2,d:"Networking",q:"What is a virtual router in PAN-OS?",a:["A VM-Series firewall","A routing instance holding routes and protocols for a set of interfaces","A redundancy module","A Panorama construct only"],c:1,x:"The virtual router is where static routes, OSPF, and BGP live. Multiple VRs can isolate routing domains on one firewall, similar to VRFs."},
{t:"paloalto",lv:2,d:"GlobalProtect",q:"In GlobalProtect, how do portal and gateway roles split?",a:["Portal terminates tunnels; gateways serve config","Portal delivers client configuration; gateways terminate the VPN tunnels","They are identical","Portal only collects logs"],c:1,x:"The agent authenticates to the portal to receive its config and gateway list, then builds its tunnel to the best gateway. One portal can front many gateways worldwide."},
{t:"paloalto",lv:2,d:"Panorama",q:"What is Panorama?",a:["A reporting add-on","Centralized management for fleets of firewalls: shared policy, templates, and log collection","The PAN-OS CLI","A threat intelligence feed"],c:1,x:"Panorama pushes consistent policy and settings to many firewalls and aggregates their logs — the control tower for multi-firewall estates."},
{t:"paloalto",lv:2,d:"Fundamentals",q:"You changed rules in the web UI but traffic behavior is unchanged. Why?",a:["A reboot is required","Changes sit in the CANDIDATE config until you commit","Your license expired","Panorama must approve first"],c:1,x:"PAN-OS edits a candidate configuration; nothing takes effect until commit validates and activates it as the running config. This lets you stage and review changes safely."},
{t:"paloalto",lv:2,d:"HA",q:"In an active/passive HA pair, what do the HA1 and HA2 links carry?",a:["HA1 data, HA2 hellos","HA1 control (hellos, config sync); HA2 session state sync","Both carry user traffic","HA1 internet, HA2 LAN"],c:1,x:"HA1 is the control link — heartbeats and configuration sync. HA2 replicates session tables so failover keeps existing connections alive."},
{t:"paloalto",lv:3,d:"NAT",q:"Writing the security rule for inbound destination-NATted traffic, you match on:",a:["Post-NAT IP and pre-NAT zone","PRE-NAT destination IP and POST-NAT destination zone","Post-NAT IP and post-NAT zone","Pre-NAT IP and pre-NAT zone"],c:1,x:"The security lookup happens after the NAT rule is chosen but before translation: the packet still carries the public (pre-NAT) IP, while the zone reflects where it will END UP (post-NAT). The #1 PAN exam and real-world gotcha."},
{t:"paloalto",lv:3,d:"Policies",q:"A carefully written specific rule never gets any hits. Most likely cause?",a:["It needs a commit... which you did","An earlier, broader rule SHADOWS it — first-match already caught the traffic","Rules must be alphabetical","App-ID is off"],c:1,x:"Shadowing: a broad rule above (e.g., allow trust→untrust any) matches first, so the specific rule below never sees traffic. PAN-OS even warns about shadowed rules at commit."},
{t:"paloalto",lv:3,d:"Decryption",q:"Which decryption mode inspects OUTBOUND user traffic to internet sites?",a:["SSL Inbound Inspection","SSL Forward Proxy — the firewall re-signs sites' certificates with a CA your clients trust","SSH Proxy","Outbound TLS cannot be decrypted"],c:1,x:"Forward proxy man-in-the-middles outbound TLS: it presents a firewall-signed certificate to the client (which must trust the firewall's CA) and makes its own connection to the real site."},
{t:"paloalto",lv:3,d:"NAT",q:"Internal users can't reach the company web server via its PUBLIC IP. Which NAT pattern fixes this?",a:["Plain source NAT","U-turn NAT — translating destination (and source) for internal clients hitting the public address","It cannot be fixed","Disabling NAT for internal zones"],c:1,x:"Traffic hairpins: trust→trust via the public IP. U-turn NAT translates the destination back to the internal server (and source-NATs so replies return through the firewall)."},
{t:"paloalto",lv:3,d:"Zone Protection",q:"Zone Protection profile vs DoS Protection policy — the difference?",a:["No difference","Zone Protection guards a zone's edge broadly (floods, recon, packet anomalies); DoS policies protect SPECIFIC destinations with classified per-IP limits","Zone Protection is IPv6-only","DoS policies replace security rules"],c:1,x:"Zone Protection is aggregate, applied at the ingress zone. DoS Protection policies target critical servers with their own thresholds, including per-source classification."},
{t:"paloalto",lv:3,d:"Networking",q:"The firewall's own DNS and update traffic must egress a data-plane interface instead of MGT. You configure:",a:["A default route on MGT","Service routes","SD-WAN","A loopback zone"],c:1,x:"Service routes redirect the firewall's self-generated services (DNS, updates, WildFire, LDAP...) out chosen data interfaces — standard when MGT has no internet path."},
{t:"paloalto",lv:3,d:"App-ID",q:"A session's app shows 'ssl' at first, then shifts to 'facebook-base'. Why?",a:["A misconfiguration","App-ID refines its identification as more of the session is seen — an application shift","User-ID failed","Cache expiry"],c:1,x:"Identification is progressive: early packets may only reveal TLS (SNI), and later inspection (or decryption) narrows to the specific app. Policy is re-evaluated on shift — which can change which rule matches."},
{t:"paloalto",lv:3,d:"Panorama",q:"In Panorama, how do device groups and templates divide the work?",a:["Both push policy","Device groups push POLICY and objects; templates push NETWORK and device settings","Templates push policy; device groups push interfaces","Interchangeable"],c:1,x:"Device groups = security/NAT rules and objects, in a hierarchy. Templates/template stacks = interfaces, zones, routing, and device config. Two separate pipelines, one commit-and-push."},
{t:"paloalto",lv:4,d:"App-ID",q:"What is the operational risk of an Application Override policy?",a:["Higher CPU","Matched traffic bypasses App-ID and threat inspection — it's handled as pure Layer 4","It breaks HA","It disables logging"],c:1,x:"Override forces a custom app name by port/IP and skips the App-ID engine — and with it most Content-ID inspection. Use it only for trusted internal protocols that misidentify."},
{t:"paloalto",lv:4,d:"Decryption",q:"SSL Inbound Inspection with the server's static RSA key fails on many sessions. Likely reason?",a:["Wrong certificate chain","Sessions used ephemeral key exchange (DHE/ECDHE) — perfect forward secrecy defeats static-key decryption","MTU issues","Expired license"],c:1,x:"Static-key inbound inspection can only decrypt RSA key exchange. PFS ciphers negotiate per-session keys the firewall never sees — modern TLS 1.3 requires proxy-based approaches."},
{t:"paloalto",lv:4,d:"Panorama",q:"In what order do Panorama pre-rules, local device rules, and post-rules evaluate?",a:["Local always first","Pre-rules → local rules → post-rules, top-down within each block","Post-rules first","Order randomizes at commit"],c:1,x:"Pre-rules enforce org-wide musts before local admins' rules; post-rules catch what nothing else matched (e.g., a logged deny-all). Local autonomy lives in the middle."},
{t:"paloalto",lv:4,d:"HA",q:"Why does active/active HA add complexity that active/passive avoids?",a:["More licenses only","Asymmetric flows require session-owner and session-setup roles, with packets forwarded between peers over HA3","Sessions can't sync","App-ID turns off"],c:1,x:"With both units passing traffic, a flow's packets can arrive at either peer. The pair coordinates who owns each session and shuttles packets over HA3 — active/passive sidesteps all of it, which is why it's the default recommendation."},
{t:"paloalto",lv:4,d:"Architecture",q:"What does Palo Alto's single-pass architecture mean?",a:["One CPU core per session","Traffic is parsed once, with App-ID, User-ID, and Content-ID applied in parallel rather than chained through serial engines","One rule per packet","Only one profile per rule"],c:1,x:"Instead of daisy-chained inspection engines each re-parsing the stream, one pass feeds all functions — the performance argument behind running full inspection at line rate."},
{t:"paloalto",lv:4,d:"Troubleshooting",q:"Which CLI command shows which security rule a hypothetical flow WOULD match?",a:["show session all","test security-policy-match","debug dataplane pool statistics","show running security-policy"],c:1,x:"'test security-policy-match source X destination Y ... application Z' evaluates the rulebase for you — the fastest way to settle 'which rule is eating this traffic?' debates."},
{t:"paloalto",lv:4,d:"App-ID",q:"Without decryption, how does App-ID classify most HTTPS applications?",a:["It can't at all","From TLS metadata — SNI and certificate details — often to the specific app, otherwise generically as 'ssl'","By packet sizes","By TTL values"],c:1,x:"The TLS handshake leaks the destination name (SNI/cert CN), enough to identify many apps. Content-level inspection inside the session still requires decryption."},
{t:"paloalto",lv:4,d:"Threat Prevention",q:"A never-seen malicious file passes the firewall; minutes later the same file is blocked everywhere. What happened?",a:["An analyst wrote a signature","WildFire detonated the sample, verdicted it malicious, and pushed generated signatures to all subscribers","The file self-deleted","URL filtering caught up"],c:1,x:"That's the WildFire loop: unknown → sandbox detonation → verdict → auto-generated AV/DNS/URL protections distributed globally, typically within minutes."},
];
